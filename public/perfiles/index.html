":"Aprobado"},{"codigo":"HARD-TI-03","competencia":"Ciberseguridad y Seguridad de la Información","tipo":"HARD","categoria":"Técnica / Especializada","familia":"","gerencia":"Administración y Finanzas","area":"Tecnología e Información","definicion":"Capacidad para proteger información y activos tecnológicos mediante controles de seguridad, gestión de riesgos y respuesta a incidentes.","niveles":["Reconoce riesgos básicos y aplica controles, políticas y buenas prácticas establecidas.","Monitorea alertas y vulnerabilidades habituales, ejecuta controles y documenta incidentes según procedimiento.","Evalúa riesgos, implementa controles y gestiona incidentes con autonomía, asegurando seguimiento y remediación.","Diseña controles para escenarios complejos, coordina respuesta a incidentes relevantes y fortalece arquitectura y concientización.","Define estrategia y gobierno de seguridad, prioriza riesgos críticos y establece capacidades de prevención, detección y respuesta alineadas al negocio."],"estado":"Aprobado"},{"codigo":"HARD-TI-04","competencia":"Gestión de Bases de Datos","tipo":"HARD","categoria":"Técnica / Especializada","familia":"","gerencia":"Administración y Finanzas","area":"Tecnología e Información","definicion":"Capacidad para administrar bases de datos asegurando integridad, disponibilidad, rendimiento, respaldo y recuperación de la información.","niveles":["Consulta estructuras básicas y ejecuta tareas operativas siguiendo scripts o procedimientos definidos.","Realiza mantenimiento, respaldos y controles habituales e identifica problemas de calidad o rendimiento.","Administra bases con autonomía, optimiza consultas, controla accesos y asegura respaldo, recuperación e integridad.","Resuelve problemas complejos de rendimiento o disponibilidad, diseña esquemas de alta disponibilidad y mejora modelos de datos.","Define arquitectura y estándares de datos, capacidad, resiliencia y seguridad para plataformas críticas y de alta escala."],"estado":"Aprobado"},{"c const V55_STORE='frigor_master_competencies_v55';
const V55_META='frigor_master_competencies_meta_v55';
const v55LegacyNames=new Map(comps.map(c=>[String(c.id),c.n]));
let v55Master=loadV55Master();
let v55OtherHard=false;

function v55Norm(value){return String(value||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,' ').trim()}
function v55Type(row){const t=v55Norm(row.tipo),c=v55Norm(row.categoria);if(c.includes('organiz'))return'Organizacional';if(c.includes('gestion por familia'))return'Gestión';if(t.includes('soft'))return'Soft';return'Hard'}
function v55BaseType(row){return v55Norm(row.tipo).includes('soft')||v55Norm(row.codigo).startsWith('soft')?'SOFT':'HARD'}
function v55Comp(row){return{id:String(row.codigo),code:String(row.codigo),n:String(row.competencia),t:v55Type(row),baseType:v55BaseType(row),cat:String(row.categoria||''),familia:String(row.familia||''),gerencia:String(row.gerencia||''),a:String(row.area||''),d:String(row.definicion||''),levelDescriptions:(row.niveles||[]).map(String),estado:String(row.estado||'') }}
function v80UsesSoftHardTypes(master){return Array.isArray(master?.competencias)&&master.competencias.length&&master.competencias.every(row=>['soft','hard'].includes(v55Norm(row.tipo)))}
function loadV55Master(){try{const stored=JSON.parse(localStorage.getItem(V55_STORE)||'null');if(v80UsesSoftHardTypes(stored))return stored}catch(_){ }const embedded=JSON.parse(JSON.stringify(V55_EMBEDDED));localStorage.setItem(V55_STORE,JSON.stringify(embedded));localStorage.setItem(V55_META,JSON.stringify({archivo:'Base_Maestra_Manual_Competencias_FRIGOR_FINAL_SOFT_HARD.xlsx',fecha:'Versión integrada',registros:embedded.competencias.length}));return embedded}
function activeV55Rows(){return v55Master.competencias.filter(r=>!r.estado||v55Norm(r.estado)==='aprobado')}
function refreshV55Comps(){const next=activeV55Rows().map(v55Comp);comps.splice(0,comps.length,...next)}
function v55FindByName(name){const k=v55Norm(name);return comps.find(c=>v55Norm(c.n)===k)}
function migrateV55Data(){
  const migrateProfile=p=>{p.competencias=Array.isArray(p.competencias)?p.competencias:[];p.competencias=p.competencias.map(x=>{if(comps.some(c=>c.id===x.id))return x;const name=v55LegacyNames.get(String(x.id))||x.nombre||x.n;const c=v55FindByName(name);return c?{id:c.id,nivel:Number(x.nivel)||0}:null}).filter(Boolean).filter((x,i,a)=>a.findIndex(y=>y.id===x.id)===i).filter(x=>v55CompById(x.id)?.t!=='Organizacional');const legacyTools=[];(p.habilidades||[]).forEach(h=>{const c=v55FindByName(h.nombre);if(c&&c.t==='Hard'&&!p.competencias.some(x=>x.id===c.id))p.competencias.push({id:c.id,nivel:Number(h.nivel)||0});else if(h.nombre)legacyTools.push({nombre:h.nombre,detalle:h.detalle||((Number(h.nivel)||0)?`${Number(h.nivel)} · ${levels[Number(h.nivel)-1]||''}`:'')})});p.herramientas=Array.isArray(p.herramientas)?p.herramientas:legacyTools;return p};
  profiles=profiles.map(migrateProfile);if(draft)migrateProfile(draft);
  const migrateEval=e=>{e.niveles=e.niveles||{};e.habilidades=e.habilidades||{};Object.entries(e.habilidades).forEach(([name,val])=>{const c=v55FindByName(name);if(c&&!e.niveles[c.id])e.niveles[c.id]=Number(val)||0});return e};
  evals=evals.map(migrateEval);candidates=candidates.map(migrateEval);if(currentEval)migrateEval(currentEval);
  localStorage.setItem('frigor_profiles',JSON.stringify(profiles));localStorage.setItem('frigor_evals',JSON.stringify(evals));localStorage.setItem(candidateKey,JSON.stringify(candidates));
}
function v55CompById(id){return comps.find(c=>String(c.id)===String(id))}
refreshV55Comps();migrateV55Data();

function v55LevelDescription(c,n){return c?.levelDescriptions?.[Number(n)-1]||''}
desc=function(c,n){return v55LevelDescription(c,n)||'Descriptor pendiente en la Base Maestra.'};
manualLevelDescription=function(c,i){return v55LevelDescription(c,i+1)||'Descriptor pendiente en la Base Maestra.'};
competencyBehaviorLevelsV47=function(c){return levels.map((_,i)=>manualLevelDescription(c,i))};

function v55Meta(){try{return JSON.parse(localStorage.getItem(V55_META)||'null')}catch(_){return null}}
function v55MasterPanel(){const m=v55Meta(),counts={soft:comps.filter(c=>c.baseType==='SOFT').length,hard:comps.filter(c=>c.baseType==='HARD').length};return `<section class="master-panel"><div><h3>Base Maestra oficial de Competencias FRIGOR</h3><p>${m?`Última importación: ${esc(m.fecha)} · ${esc(m.archivo)}`:'Base inicial incorporada desde el Excel oficial adjunto.'}</p><div class="master-stats"><span>${comps.length} competencias activas</span><span>${counts.soft} SOFT</span><span>${counts.hard} HARD</span></div></div><div class="master-actions"><label class="primary" for="masterExcelInput">↑ Importar Base Maestra</label><input id="masterExcelInput" type="file" accept=".xlsx,.xls" onchange="importV55Master(this.files[0]);this.value=''" title="Importar Excel Base Maestra"></div></section>`}

async function importV55Master(file){
  if(!file)return;
  try{const X=await loadXlsx();if(!X)throw new Error('No se pudo iniciar el lector de Excel.');const data=await file.arrayBuffer(),wb=X.read(data,{type:'array'}),ws=wb.Sheets['Base Maestra'];if(!ws)throw new Error('No se encontró la hoja “Base Maestra”.');const rows=X.utils.sheet_to_json(ws,{defval:''});const required=['Código','Competencia','Tipo','Categoría','Familia de cargo','Gerencia','Área / Aplicación','Definición','Nivel 1 - Básico','Nivel 2 - En desarrollo','Nivel 3 - Competente','Nivel 4 - Avanzado','Nivel 5 - Experto'];if(!rows.length)throw new Error('La hoja Base Maestra no contiene registros.');const missing=required.filter(h=>!(h in rows[0]));if(missing.length)throw new Error('Faltan columnas: '+missing.join(', '));const imported=rows.filter(r=>String(r['Código']).trim()&&String(r['Competencia']).trim()).map(r=>({codigo:String(r['Código']).trim(),competencia:String(r['Competencia']).trim(),tipo:String(r['Tipo']).trim(),categoria:String(r['Categoría']).trim(),familia:String(r['Familia de cargo']).trim(),gerencia:String(r['Gerencia']).trim(),area:String(r['Área / Aplicación']).trim(),definicion:String(r['Definición']).trim(),niveles:[r['Nivel 1 - Básico'],r['Nivel 2 - En desarrollo'],r['Nivel 3 - Competente'],r['Nivel 4 - Avanzado'],r['Nivel 5 - Experto']].map(x=>String(x||'').trim()),estado:String(r['Estado']||'').trim()}));if(imported.length<3)throw new Error('La base no contiene suficientes competencias válidas.');v55Master={competencias:imported,familias:v55Master.familias||[]};localStorage.setItem(V55_STORE,JSON.stringify(v55Master));localStorage.setItem(V55_META,JSON.stringify({archivo:file.name,fecha:new Date().toLocaleString('es-BO'),registros:imported.length}));refreshV55Comps();migrateV55Data();renderManual();renderProfile();renderEval();renderReport();renderCandidateComparison();alert(`Base Maestra actualizada correctamente: ${comps.length} competencias activas.`)}catch(err){alert('No se pudo importar la Base Maestra. '+err.message)}

function consolidateProfilesV83(list){
  const result=[],byCargo=new Map(),idMap=new Map();
  (list||[]).forEach(item=>{
    const key=cargoKeyV83(item);

};
