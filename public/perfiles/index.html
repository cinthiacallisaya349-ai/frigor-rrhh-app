const V55_EMBEDDED={"competencias":[{"codigo":"SOFT-ORG-01","competencia":"Integridad","tipo":"SOFT","categoria":"Organizacional","familia":"","gerencia":"","area":"Todos los cargos","definicion":"Actúa con ética, honestidad y coherencia, respetando las normas y principios de la organización, utilizando responsablemente la información y los recursos, cumpliendo sus compromisos y actuando correctamente aun cuando no exista supervisión directa.","niveles":["","","","",""],"estado":"Aprobado"},{"codigo":"SOFT-ORG-02","competencia":"Sentido de Pertenencia","tipo":"SOFT","categoria":"Organizacional","familia":"","gerencia":"","area":"Todos los cargos","definicion":"Se identifica con FRIGOR, sus valores, objetivos y propósito, demostrando compromiso con el cuidado de la organización, sus recursos y su reputación, y actuando considerando el impacto de sus acciones en el conjunto de la empresa.","niveles":["","","","",""],"estado":"Aprobado"},{"codigo":"SOFT-ORG-03","competencia":"Compromiso","tipo":"SOFT","categoria":"Organizacional","familia":"","gerencia":"","area":"Todos los cargos","definicion":"Asume con responsabilidad los objetivos, acuerdos y responsabilidades de su función, manteniendo constancia y disposición para alcanzar los resultados esperados y respondiendo por el cumplimiento de los compromisos asumidos.","niveles":["","","","",""],"estado":"Aprobado"},{"codigo":"SOFT-TR-01","competencia":"Comunicación Efectiva","tipo":"SOFT","categoria":"Transversal","familia":"","gerencia":"","area":"Según perfil","definicion":"Capacidad para expresar y recibir información, ideas y expectativas de manera clara, oportuna y adecuada al interlocutor y contexto, verificando la comprensión y favoreciendo relaciones de trabajo efectivas.","niveles":["Transmite información sencilla de forma comprensible, escucha indicaciones y realiza preguntas cuando requiere aclaraciones para ejecutar correctamente su trabajo.","Organiza y comunica información relevante de manera clara, adapta parcialmente su mensaje al interlocutor y verifica la comprensión en situaciones habituales.","Comunica ideas, expectativas y situaciones con claridad y oportunidad, practica escucha activa, adapta el mensaje a diferentes interlocutores y facilita conversaciones orientadas a acuerdos y resultados.","Gestiona comunicaciones complejas o sensibles, estructura mensajes de alto impacto, identifica barreras de comprensión y facilita conversaciones entre actores con perspectivas diferentes.","Diseña y conduce comunicaciones de alta relevancia organizacional, logra comprensión y alineación en escenarios complejos y fortalece prácticas de comunicación que favorecen confianza, coordinación y efectividad."],"estado":"Aprobado"},{"codigo":"SOFT-TR-02","competencia":"Orientación a Resultados","tipo":"SOFT","categoria":"Transversal","familia":"","gerencia":"","area":"Según perfil","definicion":"Capacidad para dirigir esfuerzos y recursos hacia el cumplimiento de objetivos, manteniendo foco en las prioridades, realizando seguimiento al avance y actuando oportunamente ante obstáculos que puedan afectar los resultados esperados.","niveles":["Comprende los resultados esperados de su función y ejecuta las actividades asignadas procurando cumplir los plazos y criterios establecidos.","Organiza sus esfuerzos de acuerdo con las prioridades, realiza seguimiento a sus avances y toma acciones frente a dificultades habituales para cumplir los resultados comprometidos.","Mantiene foco sostenido en los objetivos, prioriza acciones de mayor impacto, supera obstáculos y ajusta su ejecución para asegurar el cumplimiento de resultados aun ante condiciones exigentes.","Gestiona objetivos desafiantes y múltiples prioridades, moviliza recursos y acciones frente a desviaciones y eleva consistentemente el nivel de resultados de su ámbito.","Impulsa estándares superiores de desempeño, alinea esfuerzos alrededor de resultados críticos y genera condiciones para sostener el cumplimiento de objetivos de alto impacto aun en escenarios complejos."],"estado":"Aprobado"},{"codigo":"SOFT-TR-03","competencia":"Trabajo en Equipo","tipo":"SOFT","categoria":"Transversal","familia":"","gerencia":"","area":"Según perfil","definicion":"Capacidad para colaborar activamente con otras personas, compartir información y responsabilidades y contribuir al logro de objetivos comunes, anteponiendo los resultados colectivos cuando la situación lo requiere.","niveles":["Participa respetuosamente en actividades grupales, cumple las responsabilidades asignadas y comparte la información necesaria para realizar el trabajo conjunto.","Colabora activamente, ofrece apoyo cuando es necesario y coordina sus actividades considerando las necesidades y responsabilidades de otros miembros del equipo.","Contribuye activamente a objetivos colectivos, facilita la cooperación, comparte conocimientos y aborda diferencias de manera constructiva para mantener la efectividad del equipo.","Fortalece la colaboración entre personas o equipos con perspectivas distintas, facilita acuerdos y genera dinámicas que permiten aprovechar capacidades complementarias.","Construye entornos de alta colaboración entre equipos y áreas, supera barreras funcionales y consolida prácticas de trabajo conjunto que permiten alcanzar resultados que no serían posibles individualmente."],"estado":"Aprobado"},{"codigo":"SOFT-TR-04","competencia":"Negociación","tipo":"SOFT","categoria":"Transversal","familia":"","gerencia":"","area":"Según perfil","definicion":"Capacidad para preparar, conducir y cerrar acuerdos considerando objetivos, intereses, alternativas y límites de las partes, buscando resultados favorables y relaciones sostenibles.","niveles":["Reconoce los objetivos y condiciones básicas de una negociación, expresa su posición con claridad e identifica los principales intereses de la otra parte.","Prepara negociaciones habituales, identifica márgenes de acuerdo, plantea alternativas y maneja concesiones sencillas respetando los criterios establecidos.","Conduce negociaciones con autonomía, analiza intereses y alternativas, gestiona objeciones y concesiones y construye acuerdos equilibrados que protegen los objetivos bajo su responsabilidad.","Gestiona negociaciones complejas con múltiples variables o intereses contrapuestos, desarrolla escenarios y alternativas y preserva relaciones relevantes sin comprometer condiciones críticas.","Diseña y conduce negociaciones de alta complejidad e impacto, identifica oportunidades de valor para las partes y construye acuerdos sostenibles aun en escenarios de elevada presión o posiciones inicialmente distantes."],"estado":"Aprobado"},{"codigo":"SOFT-TR-05","competencia":"Adaptabilidad","tipo":"SOFT","categoria":"Transversal","familia":"","gerencia":"","area":"Según perfil","definicion":"Capacidad para ajustar de manera efectiva comportamientos, prioridades y formas de trabajo frente a cambios de contexto, condiciones, responsabilidades o requerimientos.","niveles":["Acepta cambios en instrucciones o condiciones habituales y ajusta su trabajo cuando recibe orientación clara.","Se adapta a modificaciones de prioridades, procesos o responsabilidades, aprendiendo nuevas formas de trabajo con acompañamiento limitado.","Responde con efectividad ante cambios relevantes, reorganiza prioridades y modifica su enfoque sin afectar significativamente la continuidad o calidad de sus resultados.","Se desenvuelve eficazmente en escenarios cambiantes o ambiguos, ajusta rápidamente estrategias de actuación y facilita la adaptación de otras personas.","Mantiene efectividad en contextos de transformación e incertidumbre elevada y genera condiciones que fortalecen la capacidad de adaptación de equipos o procesos ante escenarios futuros."],"estado":"Aprobado"},{"codigo":"SOFT-TR-06","competencia":"Orientación al Cliente","tipo":"SOFT","categoria":"Transversal","familia":"","gerencia":"","area":"Según perfil","definicion":"Capacidad para comprender las necesidades del cliente interno o externo y responder con soluciones oportunas y de calidad, procurando generar una experiencia positiva y relaciones sostenibles.","niveles":["Atiende requerimientos con respeto y disposición, comprende necesidades sencillas y brinda respuestas de acuerdo con procedimientos establecidos.","Identifica expectativas del cliente, realiza seguimiento a sus requerimientos y busca alternativas dentro de su alcance para brindar respuestas oportunas.","Comprende necesidades explícitas e implícitas, gestiona requerimientos con autonomía y propone soluciones que equilibran satisfacción del cliente y condiciones de la organización.","Anticipa necesidades, gestiona situaciones complejas o insatisfacciones y utiliza información del cliente para mejorar soluciones, servicios o relaciones.","Desarrolla enfoques que fortalecen la experiencia y relación con clientes estratégicos, convirtiendo sus necesidades y expectativas en oportunidades de mejora y generación de valor para el negocio."],"estado":"Aprobado"},{"codigo":"SOFT-TR-07","competencia":"Atención al Detalle","tipo":"SOFT","categoria":"Transversal","familia":"","gerencia":"","area":"Según perfil","definicion":"Capacidad para identificar y verificar elementos relevantes del trabajo, detectando inconsistencias, omisiones o errores que puedan afectar la calidad y confiabilidad del resultado.","niveles":["Revisa aspectos evidentes de su trabajo y detecta errores simples utilizando pautas o criterios definidos.","Verifica sistemáticamente datos, documentos o actividades e identifica inconsistencias antes de finalizar su trabajo.","Detecta diferencias, omisiones y relaciones poco evidentes, verifica aspectos críticos y previene errores que podrían afectar procesos posteriores.","Identifica patrones de error y puntos críticos que requieren mayor control y establece mecanismos de revisión para elevar la confiabilidad del trabajo.","Define criterios de verificación para información o procesos de alta sensibilidad y desarrolla controles que reducen significativamente errores y riesgos derivados de inconsistencias."],"estado":"Aprobado"},{"codigo":"SOFT-TR-08","competencia":"Pensamiento Crítico","tipo":"SOFT","categoria":"Transversal","familia":"","gerencia":"","area":"Según perfil","definicion":"Capacidad para evaluar objetivamente información, argumentos y supuestos, cuestionando su validez y contrastando evidencias antes de aceptar conclusiones o adoptar una posición.","niveles":["Distingue hechos de opiniones e identifica cuándo necesita información adicional antes de aceptar una conclusión.","Compara fuentes y argumentos, formula preguntas relevantes e identifica inconsistencias o supuestos evidentes.","Evalúa la calidad de la evidencia, cuestiona supuestos, contrasta perspectivas y construye conclusiones fundamentadas evitando interpretaciones apresuradas.","Examina situaciones complejas desde perspectivas diferentes, identifica sesgos y supuestos implícitos y cuestiona razonadamente enfoques establecidos cuando la evidencia lo justifica.","Eleva la calidad del razonamiento colectivo, desafía paradigmas con argumentos sólidos y establece criterios que permiten evaluar información compleja y tomar posiciones fundamentadas en escenarios de alta incertidumbre."],"estado":"Aprobado"},{"codigo":"SOFT-TR-09","competencia":"Proactividad","tipo":"SOFT","categoria":"Transversal","familia":"","gerencia":"","area":"Según perfil","definicion":"Capacidad para anticiparse a necesidades, riesgos u oportunidades y actuar oportunamente dentro de su ámbito de responsabilidad sin depender de instrucciones permanentes.","niveles":["Muestra disposición para actuar y asume tareas sencillas cuando identifica claramente una necesidad dentro de su función.","Identifica necesidades habituales antes de que sean solicitadas y toma iniciativa para resolverlas dentro de los límites establecidos.","Anticipa situaciones que pueden afectar resultados, inicia acciones oportunamente y busca alternativas sin esperar instrucciones cuando cuenta con información suficiente.","Identifica anticipadamente riesgos y oportunidades menos evidentes, moviliza acciones preventivas y promueve iniciativas que generan mejoras relevantes.","Detecta tempranamente tendencias, necesidades u oportunidades de alto impacto y moviliza iniciativas que permiten a la organización adelantarse a situaciones futuras."],"estado":"Aprobado"},{"codigo":"SOFT-TR-10","competencia":"Innovación","tipo":"SOFT","categoria":"Transversal","familia":"","gerencia":"","area":"Según perfil","definicion":"Capacidad para cuestionar enfoques existentes y generar, evaluar e implementar nuevas ideas o soluciones que aporten mejoras relevantes a productos, servicios, procesos o formas de trabajo.","niveles":["Muestra apertura a nuevas ideas y propone ajustes sencillos cuando identifica oportunidades evidentes de hacer mejor una actividad.","Genera alternativas frente a necesidades habituales y participa activamente en la implementación y prueba de nuevas formas de trabajo.","Desarrolla soluciones diferentes y viables, evalúa sus beneficios y riesgos y las convierte en mejoras aplicables dentro de su ámbito.","Impulsa soluciones innovadoras para desafíos complejos, combina conocimientos o enfoques distintos y gestiona su implementación hasta demostrar resultados.","Genera condiciones para la innovación sistemática, identifica oportunidades transformadoras y convierte nuevas ideas en soluciones de alto impacto y aplicación sostenible para el negocio."],"estado":"Aprobado"},{"codigo":"SOFT-TR-11","competencia":"Impacto e Influencia","tipo":"SOFT","categoria":"Transversal","familia":"","gerencia":"","area":"Según perfil","definicion":"Capacidad para generar aceptación, compromiso o movilización en otras personas mediante argumentos, relaciones y estrategias de influencia adecuadas, incluso sin contar con autoridad directa.","niveles":["Expresa sus ideas y argumentos de forma clara y comprende que diferentes interlocutores pueden requerir enfoques distintos.","Utiliza argumentos relevantes, adapta parcialmente su enfoque al interlocutor y logra apoyo en situaciones habituales.","Comprende intereses y motivaciones, adapta su estrategia de influencia y logra acuerdos o compromiso de actores relevantes para avanzar en objetivos.","Influye sobre múltiples actores con intereses distintos, construye alianzas y utiliza argumentos, relaciones y oportunidad para movilizar decisiones complejas.","Genera influencia en actores clave de alto nivel, construye redes de apoyo y moviliza decisiones o cambios relevantes aun cuando existen posiciones contrapuestas o elevada resistencia."],"estado":"Aprobado"},{"codigo":"SOFT-TR-12","competencia":"Desarrollo de Personas","tipo":"SOFT","categoria":"Transversal","familia":"","gerencia":"","area":"Según perfil","definicion":"Capacidad para identificar fortalezas y necesidades de desarrollo en otras personas y generar experiencias, retroalimentación y oportunidades que fortalezcan sus capacidades y desempeño.","niveles":["Comparte conocimientos y brinda orientación básica cuando otra persona requiere apoyo para ejecutar una actividad.","Proporciona retroalimentación concreta, identifica necesidades evidentes de aprendizaje y acompaña el desarrollo de habilidades específicas.","Identifica fortalezas y brechas individuales, establece acciones de desarrollo, delega experiencias de aprendizaje y realiza seguimiento a su evolución.","Desarrolla talento de manera planificada, prepara personas para responsabilidades de mayor complejidad y genera oportunidades que aceleran su crecimiento y autonomía.","Construye capacidades sostenibles de desarrollo y sucesión, identifica talento crítico y fortalece prácticas mediante las cuales otros líderes desarrollan sistemáticamente a sus equipos."],"estado":"Aprobado"},{"codigo":"SOFT-TR-13","competencia":"Impulso Comercial","tipo":"SOFT","categoria":"Transversal","familia":"","gerencia":"","area":"Según perfil","definicion":"Capacidad para identificar y movilizar oportunidades comerciales, mantener una actitud activa hacia el crecimiento y convertir necesidades del mercado o clientes en acciones que contribuyan a los resultados del negocio.","niveles":["Reconoce oportunidades comerciales evidentes y demuestra disposición para promover productos, servicios o alternativas dentro de su ámbito.","Busca activamente oportunidades con clientes actuales o potenciales, realiza seguimiento y sostiene acciones comerciales para generar resultados.","Identifica oportunidades de crecimiento, prioriza clientes o iniciativas con potencial y moviliza acciones para convertir oportunidades en resultados comerciales concretos.","Detecta oportunidades menos evidentes en clientes, canales o mercados, moviliza recursos y desarrolla iniciativas que amplían significativamente el potencial comercial.","Anticipa espacios de crecimiento y moviliza oportunidades comerciales de alto impacto, generando dinámicas que fortalecen sostenidamente la expansión y posicionamiento del negocio."],"estado":"Aprobado"},{"codigo":"SOFT-TR-14","competencia":"Resolución de Problemas","tipo":"SOFT","categoria":"Transversal","familia":"","gerencia":"","area":"Según perfil","definicion":"Capacidad para identificar y comprender problemas, determinar sus causas y desarrollar soluciones efectivas considerando impacto, viabilidad y prevención de recurrencias.","niveles":["Reconoce problemas habituales, recopila información básica y aplica soluciones previamente establecidas cuando la causa es conocida.","Analiza situaciones habituales, identifica causas probables y selecciona alternativas de solución dentro de criterios definidos.","Identifica causas raíz, evalúa diferentes alternativas y aplica soluciones efectivas, verificando posteriormente que el problema haya sido resuelto.","Resuelve problemas complejos con múltiples causas o variables, integra diferentes perspectivas y diseña soluciones que reducen el riesgo de recurrencia.","Aborda problemas sistémicos o de alta complejidad, identifica relaciones estructurales y desarrolla soluciones que corrigen causas profundas y fortalecen la capacidad preventiva de los procesos involucrados."],"estado":"Aprobado"},{"codigo":"SOFT-TR-15","competencia":"Planificación y Organización","tipo":"SOFT","categoria":"Transversal","familia":"","gerencia":"","area":"Según perfil","definicion":"Capacidad para estructurar actividades, prioridades, tiempos y recursos de manera ordenada, anticipando necesidades y ajustando la planificación para cumplir compromisos y objetivos.","niveles":["Organiza sus tareas siguiendo prioridades y plazos definidos y utiliza mecanismos sencillos para controlar sus pendientes.","Planifica actividades de corto plazo, distribuye adecuadamente su tiempo y ajusta prioridades ante cambios habituales.","Gestiona simultáneamente múltiples actividades y plazos, establece prioridades según impacto y urgencia y anticipa recursos o dependencias necesarios para cumplir sus compromisos.","Estructura planes para actividades complejas o interdependientes, anticipa restricciones y reorganiza prioridades, tiempos y recursos ante cambios relevantes.","Diseña enfoques de planificación para escenarios de elevada complejidad, integra múltiples dependencias y establece prácticas que elevan la capacidad de organización y cumplimiento de otros."],"estado":"Aprobado"},{"codigo":"SOFT-TR-16","competencia":"Mejora Continua","tipo":"SOFT","categoria":"Transversal","familia":"","gerencia":"","area":"Según perfil","definicion":"Capacidad para revisar sistemáticamente la forma en que se ejecuta el trabajo, identificar oportunidades de optimización e implementar mejoras que eleven la calidad, eficiencia, confiabilidad o resultados de los procesos.","niveles":["Identifica oportunidades sencillas para mejorar su trabajo y adopta cambios definidos que facilitan una mejor ejecución.","Analiza dificultades recurrentes y propone ajustes prácticos para reducir errores, tiempos innecesarios o actividades que no agregan valor.","Identifica oportunidades de mejora mediante análisis de causas y resultados, implementa soluciones y verifica que produzcan beneficios sostenibles.","Lidera mejoras en procesos de mayor complejidad, utiliza información para priorizar oportunidades y elimina causas de ineficiencia que afectan diferentes actividades o actores.","Instala mecanismos sistemáticos de mejora, identifica oportunidades de transformación y desarrolla prácticas que permiten elevar sostenidamente el desempeño de múltiples procesos o áreas."],"estado":"Aprobado"},{"codigo":"HARD-GES-01","competencia":"Visión Estratégica del Negocio","tipo":"HARD","categoria":"Gestión por Familia","familia":"Gerente General / Dirección; Gerente de División","gerencia":"","area":"Gerente General / Dirección; Gerente de División","definicion":"Capacidad para comprender integralmente el negocio, su entorno y las variables internas y externas que impactan en sus resultados, identificando oportunidades, riesgos y escenarios futuros para orientar decisiones alineadas con la estrategia y sostenibilidad de la organización.","niveles":["Comprende el modelo de negocio, sus principales procesos, clientes, productos y fuentes de generación de resultados, reconociendo cómo las decisiones de su función impactan en otras áreas.","Relaciona información de diferentes áreas y del entorno para comprender situaciones del negocio e identifica tendencias, riesgos u oportunidades que pueden afectar los resultados de su ámbito de actuación.","Analiza de manera integral variables comerciales, operativas, financieras y organizacionales para establecer prioridades y tomar decisiones considerando su impacto global en el negocio.","Anticipa escenarios y cambios relevantes del entorno, identifica oportunidades y riesgos de mediano y largo plazo y traduce estos análisis en iniciativas y decisiones estratégicas para el negocio.","Construye una visión de largo plazo del negocio integrando entorno, mercado, capacidades internas y escenarios futuros, orientando decisiones estratégicas que fortalecen la posición competitiva y sostenibilidad de la organización."],"estado":"Aprobado"},{"codigo":"HARD-GES-02","competencia":"Gestión Financiera","tipo":"HARD","categoria":"Gestión por Familia","familia":"Gerente General / Dirección","gerencia":"","area":"Gerente General / Dirección","definicion":"Capacidad para comprender, analizar y utilizar información económica y financiera para gestionar recursos, evaluar resultados y sustentar decisiones que contribuyan al desempeño y estabilidad financiera de la organización.","niveles":["Comprende conceptos financieros esenciales como ingresos, costos, gastos, presupuesto, margen y rentabilidad, e identifica su relación con las actividades bajo su responsabilidad.","Interpreta información financiera básica, realiza seguimiento al presupuesto y reconoce desviaciones entre resultados esperados y reales dentro de su ámbito de gestión.","Analiza resultados financieros, costos, presupuestos y desviaciones para tomar decisiones sobre recursos y acciones que contribuyan al cumplimiento de los objetivos del negocio.","Evalúa escenarios financieros complejos, identifica impactos económicos y optimiza la asignación de recursos considerando costos, rentabilidad, riesgos y prioridades estratégicas.","Integra información financiera y estratégica para orientar decisiones de alto impacto, evaluar escenarios de inversión y crecimiento y preservar la solidez financiera de la organización en el largo plazo."],"estado":"Aprobado"},{"codigo":"HARD-GES-03","competencia":"Orientación a la Rentabilidad y Sostenibilidad","tipo":"HARD","categoria":"Gestión por Familia","familia":"Gerente General / Dirección; Gerente de División","gerencia":"","area":"Gerente General / Dirección; Gerente de División","definicion":"Capacidad para orientar decisiones, recursos e iniciativas hacia resultados rentables y sostenibles, equilibrando crecimiento, productividad, eficiencia, uso responsable de recursos y continuidad del negocio.","niveles":["Reconoce cómo sus decisiones y actividades inciden en costos, productividad, utilización de recursos y resultados del negocio.","Identifica oportunidades para mejorar el uso de recursos y considera el impacto económico y operativo al proponer acciones dentro de su ámbito de responsabilidad.","Prioriza iniciativas considerando su contribución a la rentabilidad, eficiencia y continuidad del negocio, buscando un equilibrio entre resultados de corto plazo y sostenibilidad.","Evalúa alternativas y define acciones que optimizan recursos, productividad y rentabilidad sin comprometer capacidades críticas ni resultados futuros del negocio.","Orienta decisiones estratégicas equilibrando crecimiento, rentabilidad, eficiencia, riesgos y sostenibilidad de largo plazo, asegurando la generación consistente de valor para la organización."],"estado":"Aprobado"},{"codigo":"SOFT-GES-04","competencia":"Toma de Decisiones Estratégicas","tipo":"SOFT","categoria":"Gestión por Familia","familia":"Gerente General / Dirección","gerencia":"","area":"Gerente General / Dirección","definicion":"Capacidad para evaluar información, escenarios, riesgos e impactos relevantes y seleccionar cursos de acción que contribuyan al cumplimiento de los objetivos estratégicos de la organización.","niveles":["Identifica la información necesaria para tomar decisiones y reconoce alternativas, consecuencias y riesgos básicos antes de actuar.","Compara alternativas utilizando información disponible y criterios definidos, evaluando posibles impactos dentro de su ámbito de responsabilidad.","Toma decisiones oportunas frente a situaciones relevantes, ponderando información, riesgos, recursos, prioridades y efectos sobre diferentes procesos del negocio.","Resuelve decisiones de alta complejidad y ambigüedad, integra múltiples perspectivas y anticipa consecuencias de mediano y largo plazo antes de definir un curso de acción.","Define decisiones estratégicas de alto impacto aun en escenarios de incertidumbre, equilibrando riesgos y oportunidades y asumiendo responsablemente sus implicaciones para el futuro de la organización."],"estado":"Aprobado"},{"codigo":"SOFT-GES-05","competencia":"Liderazgo Organizacional","tipo":"SOFT","categoria":"Gestión por Familia","familia":"Gerente General / Dirección","gerencia":"","area":"Gerente General / Dirección","definicion":"Capacidad para movilizar a la organización hacia una dirección compartida, alineando personas, equipos y líderes con los objetivos estratégicos, promoviendo responsabilidad, colaboración y una cultura orientada al desempeño.","niveles":["Comprende el impacto de su comportamiento sobre otros, comunica objetivos con claridad y genera relaciones de trabajo basadas en respeto y responsabilidad.","Orienta a otros hacia objetivos comunes, brinda dirección y seguimiento y favorece la coordinación necesaria para alcanzar resultados.","Moviliza equipos hacia resultados exigentes, establece prioridades claras, genera responsabilidad por los resultados y desarrolla condiciones para un desempeño efectivo.","Alinea diferentes equipos y líderes alrededor de prioridades estratégicas, gestiona intereses diversos y fortalece una cultura de colaboración, desempeño y responsabilidad.","Moviliza a la organización alrededor de una visión compartida, desarrolla líderes y consolida una cultura capaz de sostener la estrategia, el desempeño y la evolución del negocio en el largo plazo."],"estado":"Aprobado"},{"codigo":"HARD-GES-06","competencia":"Gestión Financiera y Presupuestaria","tipo":"HARD","categoria":"Gestión por Familia","familia":"Gerente de División; Gerente de Área","gerencia":"","area":"Gerente de División; Gerente de Área","definicion":"Capacidad para planificar, administrar y controlar los recursos financieros y presupuestarios de su ámbito de gestión, analizando resultados y desviaciones para asegurar el uso eficiente de los recursos y contribuir al cumplimiento de los objetivos del negocio.","niveles":["Comprende los conceptos básicos de presupuesto, costos, gastos e ingresos relacionados con su gestión e identifica las principales partidas y recursos bajo su responsabilidad.","Realiza seguimiento al presupuesto de su ámbito, identifica variaciones respecto a lo planificado y reconoce sus principales causas e impactos.","Gestiona su presupuesto con autonomía, analiza desviaciones, controla costos y define acciones correctivas para asegurar el cumplimiento financiero de su área.","Integra variables operativas y financieras para proyectar necesidades, optimizar recursos y ajustar presupuestos frente a cambios del negocio, evaluando el impacto económico de sus decisiones.","Define criterios y escenarios presupuestarios de alta complejidad, optimiza la asignación de recursos entre diferentes prioridades y orienta decisiones que fortalecen el desempeño financiero y la sostenibilidad del negocio."],"estado":"Aprobado"},{"codigo":"SOFT-GES-07","competencia":"Liderazgo Estratégico","tipo":"SOFT","categoria":"Gestión por Familia","familia":"Gerente de División; Gerente de Área","gerencia":"","area":"Gerente de División; Gerente de Área","definicion":"Capacidad para orientar y movilizar equipos hacia el cumplimiento de objetivos estratégicos, traduciendo las prioridades del negocio en una dirección clara, desarrollando capacidades y generando compromiso y responsabilidad por los resultados.","niveles":["Comunica objetivos y expectativas con claridad, brinda orientación al equipo y comprende cómo sus acciones de liderazgo influyen en el desempeño de otros.","Organiza y orienta al equipo hacia objetivos definidos, realiza seguimiento, brinda retroalimentación y ajusta su conducción de acuerdo con las necesidades de las personas y situaciones.","Moviliza al equipo hacia resultados exigentes, establece prioridades, delega responsabilidades, desarrolla capacidades y genera compromiso con los objetivos de su ámbito de gestión.","Traduce prioridades estratégicas en objetivos para diferentes equipos, alinea líderes y recursos, desarrolla talento clave y genera condiciones para sostener un alto desempeño.","Construye capacidades de liderazgo que trascienden su propia área, desarrolla líderes capaces de multiplicar la estrategia y moviliza diferentes equipos hacia prioridades críticas y resultados sostenibles del negocio."],"estado":"Aprobado"},{"codigo":"SOFT-GES-08","competencia":"Gestión del Cambio","tipo":"SOFT","categoria":"Gestión por Familia","familia":"Gerente de División; Gerente de Área","gerencia":"","area":"Gerente de División; Gerente de Área","definicion":"Capacidad para facilitar y conducir procesos de cambio, comprendiendo su impacto en las personas, procesos y resultados, gestionando resistencias y promoviendo la adopción efectiva de nuevas formas de trabajo.","niveles":["Comprende la necesidad de los cambios definidos y adapta su forma de trabajo a nuevos lineamientos, procesos o condiciones, mostrando apertura ante nuevas formas de hacer las cosas.","Facilita la implementación de cambios dentro de su ámbito, comunica sus razones y beneficios, identifica dificultades de adopción y brinda apoyo a las personas involucradas.","Gestiona procesos de cambio en su área, identifica impactos y resistencias, involucra a los actores relevantes y define acciones para favorecer la adopción y continuidad de los cambios implementados.","Lidera transformaciones de impacto transversal, anticipa riesgos y resistencias, articula diferentes áreas y ajusta estrategias de implementación para asegurar la adopción efectiva del cambio.","Conduce transformaciones estratégicas de alta complejidad, genera condiciones organizacionales para sostenerlas y fortalece la capacidad de la organización para adaptarse y evolucionar continuamente frente a cambios del entorno y del negocio."],"estado":"Aprobado"},{"codigo":"HARD-GES-09","competencia":"Visión del Negocio","tipo":"HARD","categoria":"Gestión por Familia","familia":"Gerente de Área","gerencia":"","area":"Gerente de Área","definicion":"Capacidad para comprender el funcionamiento integral del negocio y la relación entre sus procesos, clientes, resultados y recursos, orientando las decisiones de su área considerando su impacto en el desempeño global de la organización.","niveles":["Conoce los principales productos, clientes, procesos y áreas de la organización e identifica cómo su función contribuye al funcionamiento del negocio.","Comprende las relaciones entre su área y otros procesos, identificando cómo sus decisiones pueden afectar clientes internos, operación, costos y resultados.","Integra información de diferentes procesos para tomar decisiones de su área considerando impactos comerciales, operativos, financieros y organizacionales.","Evalúa situaciones desde una perspectiva integral del negocio, anticipa impactos entre áreas y alinea prioridades y recursos de su gestión con las necesidades globales de la organización.","Posee una comprensión profunda de las interdependencias del negocio y utiliza esta perspectiva para integrar decisiones entre áreas, identificar oportunidades y fortalecer el desempeño global de la organización."],"estado":"Aprobado"},{"codigo":"HARD-GES-10","competencia":"Planificación y Gestión Táctica","tipo":"HARD","categoria":"Gestión por Familia","familia":"Subgerente","gerencia":"","area":"Subgerente","definicion":"Capacidad para traducir los lineamientos y objetivos estratégicos en planes de acción de mediano y corto plazo, definiendo prioridades, recursos, responsables, indicadores y mecanismos de seguimiento que aseguren su ejecución.","niveles":["Comprende los objetivos y lineamientos de su área y participa en la organización de actividades, recursos y plazos necesarios para su cumplimiento.","Estructura planes de trabajo para objetivos definidos, establece actividades, responsables y plazos, y realiza seguimiento a su ejecución identificando desviaciones.","Traduce objetivos del área en planes tácticos integrados, prioriza iniciativas, asigna recursos y establece mecanismos de seguimiento para asegurar resultados dentro de los plazos establecidos.","Articula planes de diferentes procesos y equipos, anticipa restricciones y dependencias y ajusta prioridades y recursos frente a cambios que puedan comprometer los objetivos del área.","Diseña modelos de planificación táctica que conectan las prioridades estratégicas con la ejecución, integrando diferentes áreas, recursos y horizontes de planificación para asegurar resultados sostenibles."],"estado":"Aprobado"},{"codigo":"HARD-GES-11","competencia":"Gestión por Indicadores","tipo":"HARD","categoria":"Gestión por Familia","familia":"Subgerente; Jefatura","gerencia":"","area":"Subgerente; Jefatura","definicion":"Capacidad para definir, interpretar y gestionar indicadores relevantes para evaluar el desempeño, identificar desviaciones y orientar acciones que aseguren el cumplimiento de los objetivos de gestión.","niveles":["Comprende los indicadores asociados a su función, identifica qué miden y realiza seguimiento a los resultados conforme a criterios establecidos.","Interpreta tendencias y desviaciones básicas, identifica posibles causas y utiliza los indicadores para realizar seguimiento al cumplimiento de actividades y resultados.","Analiza indicadores de manera sistemática, relaciona resultados con sus causas y define acciones correctivas o de mejora frente a desviaciones relevantes.","Diseña y ajusta indicadores, integra diferentes fuentes de información y utiliza relaciones entre métricas para anticipar riesgos, evaluar desempeño y orientar decisiones de gestión.","Estructura sistemas de indicadores alineados con las prioridades del negocio, identifica relaciones críticas entre variables y utiliza la información para orientar decisiones y elevar el desempeño de diferentes procesos o áreas."],"estado":"Aprobado"},{"codigo":"SOFT-GES-12","competencia":"Liderazgo de Equipos","tipo":"SOFT","categoria":"Gestión por Familia","familia":"Subgerente; Jefatura","gerencia":"","area":"Subgerente; Jefatura","definicion":"Capacidad para orientar, coordinar y desarrollar a un equipo, estableciendo expectativas claras, generando responsabilidad, colaboración y retroalimentación para alcanzar resultados colectivos.","niveles":["Brinda orientación sobre tareas y expectativas, mantiene una comunicación respetuosa y reconoce la importancia de coordinar esfuerzos para alcanzar resultados colectivos.","Distribuye responsabilidades, realiza seguimiento al trabajo, brinda retroalimentación y atiende dificultades que afectan el desempeño o coordinación del equipo.","Conduce al equipo con autonomía, establece prioridades y responsabilidades claras, gestiona el desempeño, desarrolla capacidades y promueve colaboración para alcanzar objetivos exigentes.","Gestiona equipos diversos o de mayor complejidad, fortalece autonomía y responsabilidad, desarrolla talento y aborda oportunamente dinámicas que pueden afectar el desempeño colectivo.","Construye equipos de alto desempeño capaces de sostener resultados con autonomía, desarrolla sucesores y fortalece prácticas de liderazgo que pueden ser replicadas por otros equipos de la organización."],"estado":"Aprobado"},{"codigo":"SOFT-GES-13","competencia":"Toma de Decisiones","tipo":"SOFT","categoria":"Gestión por Familia","familia":"Subgerente; Jefatura","gerencia":"","area":"Subgerente; Jefatura","definicion":"Capacidad para analizar información y alternativas, valorar sus consecuencias y seleccionar oportunamente un curso de acción acorde con los objetivos, responsabilidades y alcance de su función.","niveles":["Identifica decisiones dentro de su ámbito, recopila información relevante y utiliza criterios o lineamientos establecidos para seleccionar alternativas sencillas.","Evalúa alternativas y consecuencias en situaciones habituales, toma decisiones dentro de su nivel de autoridad y solicita apoyo cuando el impacto o complejidad excede su alcance.","Toma decisiones oportunas y autónomas frente a situaciones de su gestión, ponderando información, riesgos, recursos y efectos sobre los resultados y actores involucrados.","Resuelve decisiones complejas con información incompleta o intereses contrapuestos, evalúa impactos entre procesos y asume responsablemente riesgos dentro de su ámbito de gestión.","Aborda decisiones de alta complejidad y ambigüedad, establece criterios que mejoran la calidad de decisión de otros y genera marcos de actuación que permiten responder consistentemente ante escenarios críticos."],"estado":"Aprobado"},{"codigo":"HARD-GES-14","competencia":"Planificación y Control","tipo":"HARD","categoria":"Gestión por Familia","familia":"Jefatura","gerencia":"","area":"Jefatura","definicion":"Capacidad para organizar la ejecución de actividades, recursos y plazos de un proceso o área, estableciendo mecanismos de control que permitan verificar el avance, detectar desviaciones y asegurar el cumplimiento de los resultados previstos.","niveles":["Organiza actividades y plazos siguiendo planes establecidos y verifica el cumplimiento de tareas mediante controles definidos.","Elabora planes de trabajo de corto plazo, distribuye actividades y recursos y realiza controles periódicos para identificar retrasos o incumplimientos.","Planifica integralmente la operación de su ámbito, establece prioridades y controles, identifica desviaciones y ajusta oportunamente recursos o actividades para asegurar resultados.","Integra múltiples frentes de trabajo, establece mecanismos preventivos de control y anticipa restricciones de capacidad, recursos o plazos que puedan afectar el cumplimiento.","Diseña esquemas de planificación y control que elevan la previsibilidad y eficiencia de procesos complejos, estableciendo criterios y prácticas que pueden aplicarse en diferentes equipos o áreas."],"estado":"Aprobado"},{"codigo":"HARD-GES-15","competencia":"Coordinación y Gestión de Procesos","tipo":"HARD","categoria":"Gestión por Familia","familia":"Coordinador / Administrador / Gestor","gerencia":"","area":"Coordinador / Administrador / Gestor","definicion":"Capacidad para coordinar actividades, recursos y actores involucrados en uno o varios procesos, asegurando su articulación, continuidad y cumplimiento de acuerdo con los objetivos y estándares establecidos.","niveles":["Reconoce las etapas, responsables y principales interacciones del proceso en el que participa, coordinando actividades sencillas conforme a lineamientos establecidos.","Coordina actividades entre diferentes responsables, realiza seguimiento a plazos y entregables e identifica dificultades que pueden afectar la continuidad del proceso.","Gestiona integralmente la coordinación del proceso, articula responsables y recursos, resuelve desajustes de ejecución y asegura el cumplimiento de plazos, estándares y resultados esperados.","Coordina procesos de mayor complejidad o con múltiples interdependencias, anticipa puntos críticos y optimiza la articulación entre áreas para mejorar continuidad, eficiencia y resultados.","Diseña y consolida mecanismos de coordinación para procesos complejos o transversales, estableciendo criterios de articulación que mejoran la integración, eficiencia y capacidad de respuesta entre diferentes áreas."],"estado":"Aprobado"},{"codigo":"HARD-GES-16","competencia":"Análisis y Seguimiento de Indicadores","tipo":"HARD","categoria":"Gestión por Familia","familia":"Coordinador / Administrador / Gestor","gerencia":"","area":"Coordinador / Administrador / Gestor","definicion":"Capacidad para realizar seguimiento sistemático a indicadores de gestión, interpretar sus resultados y tendencias e identificar desviaciones y oportunidades que faciliten el control y la toma de acciones oportunas.","niveles":["Identifica los indicadores de su proceso, comprende qué miden y recopila o registra la información necesaria de acuerdo con criterios establecidos.","Realiza seguimiento periódico, compara resultados frente a metas e identifica variaciones o tendencias que requieren atención.","Analiza resultados y tendencias, identifica causas relevantes de las desviaciones y genera información que facilita la definición y seguimiento de acciones.","Integra diferentes indicadores y fuentes de información para identificar relaciones, anticipar desviaciones y proponer ajustes que mejoren el desempeño del proceso.","Estructura modelos de seguimiento que permiten interpretar integralmente el desempeño, identificar variables críticas y mejorar la capacidad de análisis y anticipación de diferentes procesos."],"estado":"Aprobado"},{"codigo":"SOFT-GES-17","competencia":"Gestión de Equipos y Actores Clave","tipo":"SOFT","categoria":"Gestión por Familia","familia":"Coordinador / Administrador / Gestor","gerencia":"","area":"Coordinador / Administrador / Gestor","definicion":"Capacidad para coordinar y gestionar relaciones con equipos, áreas y actores relevantes, comprendiendo sus necesidades, responsabilidades e intereses para facilitar acuerdos, colaboración y cumplimiento de objetivos compartidos.","niveles":["Identifica a los principales actores relacionados con su gestión, comprende sus responsabilidades y mantiene una comunicación adecuada para coordinar actividades.","Mantiene coordinación regular con diferentes actores, gestiona requerimientos y facilita acuerdos operativos necesarios para el cumplimiento de actividades.","Articula equipos y actores con necesidades o prioridades diferentes, clarifica responsabilidades, gestiona acuerdos y mantiene relaciones de colaboración orientadas a resultados comunes.","Gestiona relaciones complejas entre múltiples actores, anticipa posibles conflictos de intereses y construye acuerdos que permiten avanzar en objetivos transversales.","Construye redes de colaboración de alto impacto, alinea actores con intereses diversos alrededor de objetivos comunes y establece mecanismos de relacionamiento que fortalecen la ejecución transversal de la organización."],"estado":"Aprobado"},{"codigo":"HARD-GES-18","competencia":"Supervisión Operativa","tipo":"HARD","categoria":"Gestión por Familia","familia":"Supervisor","gerencia":"","area":"Supervisor","definicion":"Capacidad para dirigir y verificar la ejecución diaria de las actividades operativas, coordinando personas y recursos y asegurando el cumplimiento de estándares, procedimientos, productividad, calidad y seguridad establecidos.","niveles":["Conoce las actividades y estándares de la operación, verifica tareas sencillas e informa desviaciones siguiendo los procedimientos establecidos.","Distribuye actividades, realiza seguimiento a la ejecución y detecta incumplimientos de procedimientos, tiempos o estándares, tomando acciones dentro de su alcance.","Supervisa integralmente la operación bajo su responsabilidad, coordina personas y recursos, controla resultados y corrige oportunamente desviaciones para asegurar continuidad y cumplimiento.","Gestiona operaciones de mayor complejidad, anticipa restricciones de capacidad, personas o recursos y reorganiza la ejecución para mantener productividad, calidad y seguridad.","Establece prácticas y criterios de supervisión que elevan la disciplina, eficiencia y confiabilidad de la operación, fortaleciendo la capacidad de otros supervisores para sostener los estándares establecidos."],"estado":"Aprobado"},{"codigo":"SOFT-GES-19","competencia":"Organización del Trabajo","tipo":"SOFT","categoria":"Gestión por Familia","familia":"Supervisor","gerencia":"","area":"Supervisor","definicion":"Capacidad para ordenar y distribuir actividades, personas, tiempos y recursos de trabajo, considerando prioridades y capacidad disponible para asegurar una ejecución eficiente y continua.","niveles":["Ordena actividades sencillas siguiendo prioridades, secuencias y tiempos previamente establecidos.","Distribuye tareas y recursos considerando carga de trabajo, disponibilidad y prioridades inmediatas, realizando ajustes básicos cuando se presentan cambios.","Organiza integralmente el trabajo de su equipo, equilibra cargas, secuencia actividades y asigna recursos para cumplir volúmenes, tiempos y estándares previstos.","Reorganiza dinámicamente personas, tiempos y recursos ante variaciones de demanda, restricciones o contingencias, minimizando impactos sobre la operación.","Diseña criterios y prácticas de organización del trabajo que optimizan capacidad, utilización de recursos y continuidad operativa en diferentes equipos o procesos."],"estado":"Aprobado"},{"codigo":"HARD-GES-20","competencia":"Control del Cumplimiento","tipo":"HARD","categoria":"Gestión por Familia","familia":"Supervisor","gerencia":"","area":"Supervisor","definicion":"Capacidad para verificar sistemáticamente que las actividades, procedimientos y resultados se ejecuten conforme a los estándares, normas, plazos y condiciones establecidos, actuando oportunamente frente a desviaciones.","niveles":["Conoce los principales controles y estándares aplicables a su trabajo y verifica su cumplimiento utilizando criterios previamente establecidos.","Realiza controles periódicos, registra incumplimientos o desviaciones y ejecuta las acciones definidas dentro de su nivel de responsabilidad.","Controla sistemáticamente el cumplimiento de procedimientos, estándares y resultados, identifica causas de desviación y asegura la implementación de acciones correctivas.","Establece mecanismos preventivos de control, identifica patrones de incumplimiento y ajusta prácticas de seguimiento para reducir recurrencias y riesgos operativos.","Diseña y fortalece sistemas de control que elevan la confiabilidad y disciplina de ejecución, estableciendo criterios que permiten sostener el cumplimiento en diferentes procesos."],"estado":"Aprobado"},{"codigo":"SOFT-GES-21","competencia":"Pensamiento Analítico","tipo":"SOFT","categoria":"Gestión por Familia","familia":"Analista","gerencia":"","area":"Analista","definicion":"Capacidad para descomponer situaciones, problemas o información en sus elementos relevantes, identificar relaciones, causas y patrones, y estructurar conclusiones que faciliten la comprensión y resolución de situaciones dentro de su ámbito de trabajo.","niveles":["Identifica información relevante en situaciones sencillas, diferencia datos principales de secundarios y reconoce relaciones evidentes entre variables o hechos.","Organiza y compara información de diferentes fuentes, identifica patrones básicos y analiza causas probables de situaciones habituales dentro de su función.","Analiza situaciones de manera estructurada, relaciona múltiples variables, distingue causas de efectos y construye conclusiones fundamentadas que facilitan la toma de acciones o decisiones.","Aborda situaciones complejas con múltiples variables, identifica relaciones no evidentes, contrasta hipótesis y anticipa posibles efectos a partir del análisis realizado.","Construye modelos de análisis para situaciones de alta complejidad, identifica patrones y relaciones críticas que otros pueden no advertir y transforma el análisis en criterios que mejoran la comprensión y toma de decisiones de diferentes procesos."],"estado":"Aprobado"},{"codigo":"HARD-GES-22","competencia":"Gestión y Análisis de Información","tipo":"HARD","categoria":"Gestión por Familia","familia":"Analista","gerencia":"","area":"Analista","definicion":"Capacidad para recopilar, organizar, validar y analizar información relevante de diferentes fuentes, asegurando su calidad y transformándola en insumos claros y confiables para el seguimiento, control y toma de decisiones.","niveles":["Recopila y registra información siguiendo criterios definidos, reconoce las fuentes que utiliza y verifica aspectos básicos de integridad y consistencia de los datos.","Organiza información proveniente de diferentes fuentes, realiza validaciones y comparaciones e identifica inconsistencias o variaciones que requieren revisión.","Gestiona información con autonomía, valida su confiabilidad, integra diferentes fuentes y realiza análisis que permiten identificar tendencias, desviaciones y resultados relevantes para su proceso.","Estructura y optimiza mecanismos de gestión de información, relaciona múltiples fuentes y genera análisis que permiten explicar comportamientos, anticipar desviaciones y sustentar decisiones.","Diseña criterios y modelos para gestionar información compleja, fortalece su calidad y trazabilidad y desarrolla esquemas de análisis que elevan la capacidad de interpretación y decisión de diferentes procesos o áreas."],"estado":"Aprobado"},{"codigo":"HARD-GES-23","competencia":"Gestión de Información","tipo":"HARD","categoria":"Gestión por Familia","familia":"Asistente","gerencia":"","area":"Asistente","definicion":"Capacidad para recopilar, registrar, organizar, actualizar y resguardar información y documentación de su ámbito de trabajo, asegurando su disponibilidad, orden, consistencia y confidencialidad de acuerdo con los procedimientos establecidos.","niveles":["Registra y organiza información siguiendo formatos, instrucciones y criterios establecidos, manteniendo orden básico en los documentos y registros bajo su responsabilidad.","Administra información de manera ordenada, verifica datos antes de su registro, mantiene documentos actualizados e identifica inconsistencias que requieren corrección o validación.","Gestiona con autonomía información y documentación de su proceso, asegura su consistencia, actualización y disponibilidad, y responde oportunamente a requerimientos de información.","Organiza y mejora mecanismos de registro, archivo y control de información, identifica riesgos de pérdida, duplicidad o inconsistencia y propone prácticas que facilitan su consulta y confiabilidad.","Estructura criterios y mecanismos para optimizar la gestión documental y de información de procesos de mayor complejidad, fortaleciendo su trazabilidad, confiabilidad, disponibilidad y adecuado resguardo."],"estado":"Aprobado"},{"codigo":"SOFT-GES-24","competencia":"Seguimiento de Actividades","tipo":"SOFT","categoria":"Gestión por Familia","familia":"Asistente","gerencia":"","area":"Asistente","definicion":"Capacidad para realizar seguimiento sistemático a tareas, requerimientos, plazos y compromisos de su ámbito de trabajo, identificando oportunamente pendientes o desviaciones y facilitando su cumplimiento.","niveles":["Registra tareas, fechas y compromisos asignados y verifica su avance utilizando los mecanismos de seguimiento establecidos.","Mantiene control actualizado de actividades y pendientes, identifica retrasos o requerimientos incompletos y realiza recordatorios o coordinaciones básicas para facilitar su cumplimiento.","Realiza seguimiento autónomo y sistemático a múltiples actividades, prioriza pendientes según su impacto y plazo, coordina con los responsables y alerta oportunamente sobre riesgos de incumplimiento.","Integra el seguimiento de actividades interrelacionadas, anticipa posibles retrasos o dependencias y propone ajustes de coordinación que favorecen el cumplimiento de plazos y compromisos.","Diseña mecanismos de seguimiento para procesos con múltiples actividades y responsables, mejorando la visibilidad de pendientes, alertas, dependencias y cumplimiento de compromisos."],"estado":"Aprobado"},{"codigo":"HARD-GES-25","competencia":"Cumplimiento de Procedimientos","tipo":"HARD","categoria":"Gestión por Familia","familia":"Auxiliar; Operario","gerencia":"","area":"Auxiliar; Operario","definicion":"Capacidad para ejecutar las actividades de acuerdo con procedimientos, instrucciones, controles y estándares establecidos, respetando las secuencias y criterios definidos para asegurar una ejecución consistente y confiable.","niveles":["Reconoce los procedimientos e instrucciones aplicables a sus actividades y los ejecuta correctamente en tareas habituales con orientación cuando es necesario.","Aplica de manera consistente los procedimientos establecidos, verifica los requisitos básicos de ejecución e identifica situaciones que se apartan de lo definido.","Ejecuta con autonomía conforme a procedimientos y estándares, identifica desviaciones y actúa dentro de su alcance para evitar errores o incumplimientos.","Detecta debilidades o riesgos en la aplicación de procedimientos, orienta a otros sobre su correcta ejecución y propone ajustes que fortalecen el cumplimiento y la confiabilidad del proceso.","Contribuye a estructurar y mejorar procedimientos de su ámbito de especialidad, identifica controles críticos y establece prácticas que favorecen una ejecución consistente y segura."],"estado":"Aprobado"},{"codigo":"HARD-GES-26","competencia":"Calidad en la Ejecución","tipo":"HARD","categoria":"Gestión por Familia","familia":"Auxiliar; Operario","gerencia":"","area":"Auxiliar; Operario","definicion":"Capacidad para ejecutar las actividades con precisión, consistencia y cuidado, verificando que los resultados cumplan con los requisitos y estándares establecidos y previniendo errores que puedan afectar el proceso.","niveles":["Ejecuta tareas siguiendo los criterios establecidos y realiza verificaciones básicas para asegurar que el resultado sea correcto.","Mantiene consistencia en la ejecución, revisa su trabajo antes de finalizarlo e identifica y corrige errores habituales dentro de su alcance.","Entrega resultados confiables de manera sostenida, verifica aspectos críticos de su trabajo y previene errores que podrían afectar etapas posteriores del proceso.","Identifica causas recurrentes de errores o variaciones, propone ajustes en la forma de ejecución y orienta a otros para fortalecer la calidad del trabajo.","Establece prácticas y criterios de ejecución que reducen errores, aumentan la confiabilidad y contribuyen a elevar los estándares de calidad del proceso."],"estado":"Aprobado"},{"codigo":"HARD-GES-27","competencia":"Seguridad y Autocuidado","tipo":"HARD","categoria":"Gestión por Familia","familia":"Operario","gerencia":"","area":"Operario","definicion":"Capacidad para ejecutar el trabajo identificando y controlando los riesgos asociados a sus actividades, cumpliendo las normas y prácticas de seguridad y adoptando conductas de autocuidado que protejan su integridad y la de otras personas.","niveles":["Reconoce los principales riesgos de su actividad, utiliza correctamente los elementos de protección requeridos y cumple las instrucciones básicas de seguridad.","Aplica de manera consistente las prácticas de trabajo seguro, identifica condiciones o actos inseguros evidentes y los comunica de acuerdo con los procedimientos establecidos.","Gestiona activamente los riesgos de su actividad, verifica las condiciones antes y durante la ejecución y actúa oportunamente para prevenir incidentes dentro de su ámbito de responsabilidad.","Identifica riesgos menos evidentes o recurrentes, promueve prácticas seguras entre sus compañeros y contribuye a implementar acciones preventivas que reducen la exposición a incidentes.","Aporta conocimiento práctico para fortalecer controles y prácticas de seguridad, identifica oportunidades preventivas y contribuye a consolidar comportamientos de autocuidado en su proceso o equipo."],"estado":"Aprobado"},{"codigo":"HARD-CON-01","competencia":"Contabilidad General y Estados Financieros","tipo":"HARD","categoria":"Funcional","familia":"","gerencia":"Administración y Finanzas","area":"Contabilidad","definicion":"Capacidad para aplicar principios y criterios contables en el registro, clasificación, análisis y presentación de operaciones económicas, asegurando que los estados financieros representen de manera confiable la situación y resultados de la organización.","niveles":["Comprende los principios básicos del proceso contable, identifica la naturaleza de las principales cuentas y realiza registros sencillos siguiendo criterios y procedimientos previamente establecidos.","Registra y clasifica operaciones contables habituales, analiza movimientos de cuentas e identifica inconsistencias básicas, requiriendo orientación ante operaciones de mayor complejidad.","Gestiona con autonomía registros y análisis contables, aplica criterios técnicos a diferentes operaciones y participa en la preparación y revisión de estados financieros asegurando consistencia y respaldo de la información.","Analiza operaciones contables complejas, determina su tratamiento adecuado, interpreta estados financieros e identifica impactos relevantes sobre la situación financiera y los resultados de la organización.","Define criterios contables para operaciones de alta complejidad, evalúa su impacto en los estados financieros y asegura que la información financiera refleje adecuadamente la realidad económica de la organización, actuando como referente técnico en la materia."],"estado":"Aprobado"},{"codigo":"HARD-CON-02","competencia":"Normativa Contable y Tributaria","tipo":"HARD","categoria":"Técnica / Especializada","familia":"","gerencia":"Administración y Finanzas","area":"Contabilidad","definicion":"Capacidad para interpretar y aplicar la normativa contable y tributaria vigente en las operaciones de la organización, asegurando su adecuado tratamiento y reduciendo riesgos derivados de incumplimientos o interpretaciones incorrectas.","niveles":["Reconoce las principales obligaciones y normas contables y tributarias relacionadas con sus actividades y aplica instrucciones previamente definidas para operaciones habituales.","Aplica la normativa correspondiente en operaciones recurrentes, prepara documentación y cálculos requeridos e identifica situaciones que necesitan validación técnica.","Interpreta y aplica con autonomía disposiciones contables y tributarias, determina su tratamiento en situaciones diversas y verifica el cumplimiento de obligaciones dentro de su ámbito.","Analiza situaciones normativas complejas, evalúa diferentes interpretaciones y sus riesgos y establece criterios técnicos para asegurar un tratamiento adecuado y consistente.","Evalúa implicaciones de cambios normativos y operaciones de alta complejidad, define criterios de aplicación y orienta decisiones que aseguran cumplimiento y reducen la exposición contable y tributaria de la organización."],"estado":"Aprobado"},{"codigo":"HARD-CON-03","competencia":"Análisis y Conciliación de Cuentas","tipo":"HARD","categoria":"Técnica / Especializada","familia":"","gerencia":"Administración y Finanzas","area":"Contabilidad","definicion":"Capacidad para revisar, conciliar y analizar saldos y movimientos contables, identificando diferencias, partidas pendientes y causas de variación para asegurar la integridad y confiabilidad de las cuentas.","niveles":["Compara registros y documentos de respaldo, identifica diferencias sencillas y realiza conciliaciones básicas siguiendo formatos y criterios establecidos.","Ejecuta conciliaciones periódicas, identifica partidas pendientes o diferencias recurrentes y realiza verificaciones para determinar su origen.","Analiza y concilia cuentas con autonomía, investiga diferencias, determina sus causas y gestiona oportunamente ajustes o regularizaciones para asegurar saldos confiables.","Analiza cuentas de mayor complejidad, identifica patrones, riesgos o causas estructurales de diferencias y establece controles que reducen partidas pendientes y recurrencias.","Diseña criterios y metodologías de conciliación para cuentas críticas o complejas, identifica riesgos de integridad contable y fortalece controles que aseguran la confiabilidad global de los saldos."],"estado":"Aprobado"},{"codigo":"HARD-CON-04","competencia":"Contabilidad de Costos","tipo":"HARD","categoria":"Técnica / Especializada","familia":"","gerencia":"Administración y Finanzas","area":"Contabilidad","definicion":"Capacidad para identificar, registrar, analizar y controlar los costos asociados a productos, procesos y operaciones, generando información que permita evaluar eficiencia, márgenes y rentabilidad y sustentar decisiones del negocio.","niveles":["Reconoce los principales elementos del costo y diferencia conceptos como costos directos, indirectos, fijos y variables dentro de las operaciones de la organización.","Registra y clasifica información de costos, realiza cálculos habituales y compara costos reales con referencias o parámetros establecidos.","Analiza costos por producto, proceso o centro de costo, identifica desviaciones y sus causas y genera información útil para el control de márgenes y eficiencia operativa.","Evalúa estructuras de costos complejas, analiza relaciones entre volúmenes, eficiencia, costos y rentabilidad y desarrolla escenarios que sustentan decisiones operativas y comerciales.","Diseña y evalúa modelos de costeo alineados con la realidad operativa del negocio, identifica variables críticas de rentabilidad y convierte la información de costos en criterios para decisiones estratégicas."],"estado":"Aprobado"},{"codigo":"HARD-CON-05","competencia":"Gestión de Cierres Contables","tipo":"HARD","categoria":"Técnica / Especializada","familia":"","gerencia":"Administración y Finanzas","area":"Contabilidad","definicion":"Capacidad para planificar, ejecutar y controlar las actividades necesarias para el cierre contable, asegurando oportunidad, integridad, consistencia y adecuado respaldo de la información financiera del período.","niveles":["Conoce las actividades y fechas del cierre y ejecuta tareas asignadas siguiendo cronogramas, procedimientos y controles establecidos.","Gestiona actividades específicas del cierre, verifica documentación y registros e identifica pendientes o inconsistencias que pueden afectar su cumplimiento.","Ejecuta y controla con autonomía componentes relevantes del cierre, coordina regularizaciones, verifica saldos y asegura el cumplimiento oportuno de actividades bajo su responsabilidad.","Coordina cierres de mayor complejidad, identifica anticipadamente riesgos y dependencias, resuelve situaciones técnicas y asegura consistencia entre diferentes componentes de la información financiera.","Diseña y optimiza el proceso integral de cierre, establece criterios y controles críticos y asegura que la información financiera se genere de manera oportuna, consistente y confiable para la toma de decisiones."],"estado":"Aprobado"},{"codigo":"HARD-FIN-01","competencia":"Planificación Financiera y Presupuestaria","tipo":"HARD","categoria":"Funcional","familia":"","gerencia":"Administración y Finanzas","area":"Planificación y Finanzas","definicion":"Capacidad para elaborar, consolidar, controlar y proyectar presupuestos y planes financieros, relacionando los recursos económicos con los objetivos del negocio y generando información para la toma de decisiones.","niveles":["Comprende la estructura básica de un presupuesto, identifica sus principales componentes y registra información presupuestaria siguiendo criterios y formatos establecidos.","Prepara información presupuestaria, compara resultados reales frente a lo planificado e identifica variaciones básicas en ingresos, costos, gastos o inversiones.","Elabora y controla presupuestos con autonomía, analiza desviaciones y sus causas, realiza proyecciones y genera información que permite ajustar recursos y planes financieros.","Integra presupuestos de diferentes áreas o unidades, desarrolla escenarios financieros y evalúa el impacto de cambios operativos, comerciales o económicos sobre las proyecciones del negocio.","Diseña modelos integrales de planificación financiera, construye escenarios de alta complejidad y establece criterios de asignación y proyección de recursos que sustentan decisiones estratégicas de la organización."],"estado":"Aprobado"},{"codigo":"HARD-FIN-02","competencia":"Análisis Financiero y Rentabilidad","tipo":"HARD","categoria":"Funcional","familia":"","gerencia":"Administración y Finanzas","area":"Planificación y Finanzas","definicion":"Capacidad para interpretar información financiera y económica, analizar sus principales variables y relaciones y evaluar la rentabilidad y desempeño del negocio, sus unidades, productos, clientes o iniciativas.","niveles":["Reconoce los principales conceptos e indicadores financieros y comprende de manera general su relación con el desempeño económico de la organización.","Calcula e interpreta indicadores financieros habituales, compara resultados entre períodos e identifica variaciones relevantes que requieren análisis.","Analiza resultados financieros y rentabilidad, relaciona ingresos, costos, márgenes y otras variables e identifica las principales causas que explican el desempeño observado.","Integra múltiples variables financieras y operativas, analiza rentabilidad por diferentes dimensiones y construye escenarios que permiten evaluar alternativas y oportunidades de optimización.","Desarrolla enfoques avanzados de análisis financiero y rentabilidad, identifica los principales impulsores de valor económico y convierte sus conclusiones en criterios para decisiones estratégicas del negocio."],"estado":"Aprobado"},{"codigo":"HARD-FIN-03","competencia":"Gestión de Tesorería y Flujo de Caja","tipo":"HARD","categoria":"Técnica / Especializada","familia":"","gerencia":"Administración y Finanzas","area":"Planificación y Finanzas","definicion":"Capacidad para gestionar y proyectar los flujos de efectivo, disponibilidades y obligaciones financieras, asegurando la liquidez necesaria para la continuidad de las operaciones y el uso eficiente de los recursos monetarios.","niveles":["Comprende los principales movimientos de ingreso y salida de efectivo, registra información de tesorería y realiza controles básicos conforme a procedimientos establecidos.","Realiza seguimiento a disponibilidades, pagos y cobranzas, actualiza proyecciones de corto plazo e identifica posibles diferencias o necesidades de liquidez.","Gestiona y proyecta el flujo de caja con autonomía, analiza necesidades de liquidez, prioriza obligaciones y coordina movimientos para asegurar la disponibilidad de recursos.","Desarrolla escenarios de liquidez, anticipa déficits o excedentes y evalúa alternativas de financiamiento, inversión o administración de efectivo considerando costos y riesgos.","Define estrategias y modelos de gestión de liquidez y tesorería, optimizando disponibilidades, financiamiento y estructura de flujos para fortalecer la estabilidad financiera del negocio."],"estado":"Aprobado"},{"codigo":"HARD-FIN-04","competencia":"Modelamiento y Proyecciones Financieras","tipo":"HARD","categoria":"Técnica / Especializada","familia":"","gerencia":"Administración y Finanzas","area":"Planificación y Finanzas","definicion":"Capacidad para construir y utilizar modelos financieros que representen el comportamiento económico del negocio, incorporando variables, supuestos y escenarios para proyectar resultados y sustentar decisiones.","niveles":["Comprende la estructura de modelos financieros sencillos, identifica variables y supuestos principales y actualiza información siguiendo modelos previamente construidos.","Construye proyecciones básicas, relaciona variables financieras y operativas y realiza análisis de sensibilidad sobre supuestos previamente definidos.","Desarrolla modelos financieros con autonomía, formula supuestos razonables, integra diferentes variables y construye escenarios para evaluar posibles resultados.","Diseña modelos de mayor complejidad, incorpora relaciones dinámicas entre variables, desarrolla sensibilidades y escenarios múltiples y evalúa sus implicaciones financieras.","Construye modelos financieros integrales para decisiones de alta complejidad, establece metodologías y supuestos críticos y utiliza escenarios para anticipar impactos y orientar decisiones estratégicas."],"estado":"Aprobado"},{"codigo":"HARD-FIN-05","competencia":"Evaluación Financiera de Inversiones y Proyectos","tipo":"HARD","categoria":"Técnica / Especializada","familia":"","gerencia":"Administración y Finanzas","area":"Planificación y Finanzas","definicion":"Capacidad para evaluar la viabilidad económica y financiera de inversiones, proyectos e iniciativas ones.","Diseña modelos analíticos de mayor complejidad, integra grandes volúmenes o múltiples fuentes de información y genera insights que permiten anticipar comportamientos, riesgos u oportunidades del negocio.","Define enfoques y modelos de inteligencia de negocios para problemas de alta complejidad, conecta datos con variables estratégicas y desarrolla capacidades analíticas que transforman la forma en que la organización comprende y toma decisiones sobre el negocio."],"estado":"Aprobado"},{"codigo":"HARD-FIN-07","competencia":"Visualización y Comunicación de Datos","tipo":"HARD","categoria":"Técnica / Especializada","familia":"","gerencia":"Administración y Finanzas","area":"Planificación y Finanzas","definicion":"Capacidad para estructurar y representar datos e información de manera visual, clara y comprensible, seleccionando indicadores y formatos que faciliten la interpretación y toma de decisiones.","niveles":["Presenta información mediante tablas, gráficos o formatos sencillos siguiendo estructuras previamente definidas y manteniendo claridad básica en la representación.","Selecciona representaciones adecuadas para diferentes tipos de datos, organiza la información de manera comprensible y construye reportes visuales para necesidades habituales.","Diseña reportes y tableros que priorizan información relevante, utiliza adecuadamente indicadores y visualizaciones y facilita la identificación de tendencias, desviaciones y resultados.","Construye experiencias de análisis visual para información compleja, integra diferentes perspectivas y niveles de detalle y adapta la presentación a las necesidades de distintos usuarios de decisión.","Define principios y modelos de visualización para información estratégica, transforma conjuntos complejos de datos en narrativas claras y establece estándares que elevan la comprensión y utilización de información en la organización."],"estado":"Aprobado"},{"codigo":"HARD-TH-01","competencia":"Atracción y Selección de Talento","tipo":"HARD","categoria":"Funcional","familia":"","gerencia":"Administración y Finanzas","area":"Talento Humano","definicion":"Capacidad para planificar y ejecutar procesos de atracción, evaluación y selección que aseguren la incorporación de personas idóneas para las necesidades del negocio.","niveles":["Conoce las etapas del proceso y apoya publicaciones, filtros y coordinaciones siguiendo criterios definidos.","Ejecuta filtros curriculares, entrevistas iniciales y coordinaciones de procesos habituales, documentando evidencias.","Gestiona procesos completos con autonomía, aplica metodologías de evaluación y sustenta recomendaciones de selección con evidencia.","Diseña estrategias de búsqueda para posiciones complejas, mejora instrumentos y gestiona decisiones con líderes de distintas áreas.","Define metodologías y estándares de selección, desarrolla fuentes de atracción talento y asegura que la estrategia de reclutamiento responda a capacidades críticas del negocio."],"estado":"Aprobado"},{"codigo":"HARD-TH-02","competencia":"Capacitación y Desarrollo","tipo":"HARD","categoria":"Funcional","familia":"","gerencia":"Administración y Finanzas","area":"Talento Humano","definicion":"Capacidad para identificar necesidades, diseñar y gestionar soluciones de aprendizaje y desarrollo que fortalezcan capacidades requeridas por la organización.","niveles":["Apoya actividades de capacitación y registra asistencia, evidencias y resultados básicos.","Identifica necesidades sencillas, coordina acciones formativas y realiza seguimiento a su ejecución.","Diseña planes y acciones de desarrollo, selecciona metodologías y evalúa transferencia o resultados de aprendizaje.","Integra necesidades de diferentes áreas, prioriza brechas críticas y diseña rutas de desarrollo vinculadas a desempeño y carrera.","Define el modelo de aprendizaje y desarrollo, conecta capacidades futuras con estrategia y establece mecanismos para medir impacto organizacional."],"estado":"Aprobado"},{"codigo":"HARD-TH-03","competencia":"Gestión del Desempeño y Potencial","tipo":"HARD","categoria":"Funcional","familia":"","gerencia":"Administración y Finanzas","area":"Talento Humano","definicion":"Capacidad para diseñar y gestionar procesos que evalúen desempeño y potencial, generando información para desarrollo, sucesión y decisiones de talento.","niveles":["Conoce etapas, escalas y registros del proceso y brinda soporte operativo a evaluaciones.","Administra ciclos de evaluación, valida información y apoya consolidación de resultados y retroalimentación.","Gestiona metodologías de desempeño y potencial, analiza resultados y traduce brechas en acciones de desarrollo.","Integra desempeño, potencial y sucesión, facilita calibraciones y mejora criterios para decisiones de talento.","Define el modelo organizacional de desempeño y potencial y utiliza sus resultados para fortalecer liderazgo, sucesión y capacidades estratégicas."],"estado":"Aprobado"},{"codigo":"HARD-TH-04","competencia":"Compensaciones y Estructura Salarial","tipo":"HARD","categoria":"Técnica / Especializada","familia":"","gerencia":"Administración y Finanzas","area":"Talento Humano","definicion":"Capacidad para analizar y gestionar estructuras salariales, equidad interna, competitividad y movimientos de compensación de acuerdo con criterios organizacionales.","niveles":["Comprende conceptos de salario, bandas y movimientos y prepara información siguiendo criterios definidos.","Realiza comparaciones salariales, ubica posiciones en escalas y verifica movimientos habituales.","Analiza equidad, compa-ratio, posicionamiento y propuestas salariales, sustentando recomendaciones dentro de política.","Modela escenarios de ajustes, estructuras y costos, identifica inequidades y propone soluciones para segmentos complejos.","Diseña arquitectura y políticas de compensación, integra mercado, equidad, desempeño y sostenibilidad financiera en decisiones de alto impacto."],"estado":"Aprobado"},{"codigo":"HARD-TH-05","competencia":"Legislación y Relaciones Laborales","tipo":"HARD","categoria":"Técnica / Especializada","familia":"","gerencia":"Administración y Finanzas","area":"Talento Humano","definicion":"Capacidad para interpretar y aplicar normativa laboral y gestionar relaciones laborales, previniendo contingencias y promoviendo relaciones de trabajo sostenibles.","niveles":["Reconoce obligaciones laborales básicas y aplica procedimientos definidos en casos habituales.","Gestiona documentación y situaciones laborales recurrentes e identifica casos que requieren criterio especializado.","Interpreta normativa, asesora decisiones laborales y gestiona casos individuales o colectivos dentro de su ámbito.","Aborda contingencias complejas, negociaciones y relaciones sindicales, evaluando riesgos legales y organizacionales.","Define criterios de relaciones laborales, anticipa riesgos normativos y orienta decisiones de alta complejidad preservando cumplimiento y sostenibilidad laboral."],"estado":"Aprobado"},{"codigo":"HARD-TH-06","competencia":"Diseño Organizacional y Gestión de Perfiles","tipo":"HARD","categoria":"Técnica / Especializada","familia":"","gerencia":"Administración y Finanzas","area":"Talento Humano","definicion":"Capacidad para diseñar estructuras, roles y perfiles de cargo coherentes con los procesos, responsabilidades y necesidades del negocio.","niveles":["Comprende estructuras y formatos de perfil y recopila información de cargos siguiendo metodología.","Releva funciones, requisitos y relaciones organizacionales y actualiza perfiles con acompañamiento limitado.","Analiza cargos y estructuras, diseña perfiles y propone ajustes de responsabilidades, dependencia o requisitos con sustento técnico.","Evalúa estructuras y capas organizacionales, identifica duplicidades o brechas y diseña alternativas alineadas con procesos y estrategia.","Define criterios de diseño organizacional y arquitectura de cargos, orientando transformaciones estructurales y modelos de trabajo de alto impacto."],"estado":"Aprobado"},{"codigo":"HARD-TH-07","competencia":"People Analytics","tipo":"HARD","categoria":"Funcional","familia":"","gerencia":"Administración y Finanzas","area":"Talento Humano","definicion":"Capacidad para integrar y analizar datos de personas para explicar fenómenos de talento, identificar riesgos y sustentar decisiones de gestión humana.","niveles":["Prepara y depura datos básicos de personas y calcula indicadores definidos.","Construye reportes recurrentes, segmenta información e identifica tendencias básicas de dotación, rotación u otros indicadores.","Relaciona variables de talento, interpreta causas y genera análisis que sustentan decisiones y prioridades de TH.","Diseña modelos analíticos y segmentaciones avanzadas, anticipa riesgos y evalúa impacto de iniciativas de personas.","Define la agenda analítica de talento, integra datos de negocio y personas y desarrolla modelos que transforman decisiones estratégicas de capital humano."],"estado":"Aprobado"},{"codigo":"HARD-TH-08","competencia":"Clima, Cultura y Bienestar","tipo":"HARD","categoria":"Funcional","familia":"","gerencia":"Administración y Finanzas","area":"Talento Humano","definicion":"Capacidad para diagnosticar y gestionar iniciativas de clima, cultura y bienestar que fortalezcan experiencia, compromiso y condiciones organizacionales.","niveles":["Apoya actividades, comunicaciones y registros de clima o bienestar siguiendo lineamientos.","Coordina iniciativas, recopila percepción y realiza seguimiento a participación y resultados básicos.","Analiza diagnósticos, diseña planes de acción y gestiona programas de clima, cultura o bienestar según necesidades identificadas.","Integra hallazgos de diferentes colectivos, prioriza palancas culturales y evalúa efectividad de intervenciones de mayor alcance.","Define estrategias de cultura y experiencia, conecta bienestar y clima con prioridades del negocio y establece mecanismos para sostener cambios culturales."],"estado":"Aprobado"},{"codi
