function renderManual(){p2.innerHTML=title('02','Manual de competencias','Catálogo unificado por tipo de competencia y conductas observables 1–5')+`<div class="toolbar"><input id="q" placeholder="Buscar competencia…" oninput="filterManual()"><select id="ft" onchange="filterManual()"><option>Todos</option><option>Soft Skill</option><option>Hard Skill</option></select><button class="primary" onclick="toggleCompetencyForm()">＋ Añadir competencia</button></div><section id="newCompetencyForm" class="card competency-form" hidden><h3>Añadir competencia al manual</h3><div class="form"><label class="field"><span>Nombre de la competencia</span><input id="newCompName" placeholder="Ej.: Gestión de conflictos"></label><label class="field"><span>Tipo</span><select id="newCompType"><option value="">Seleccione…</option><option>Soft Skill</option><option>Hard Skill</option></select></label><label class="field wide"><span>Concepto general</span><textarea id="newCompConcept" placeholder="Defina qué significa esta competencia."></textarea></label></div><div class="custom-levels">${levels.map((x,i)=>`<label class="field"><span>Nivel ${i+1} · ${x}</span><textarea id="newCompLevel${i+1}" placeholder="Describa la conducta observable de este nivel."></textarea></label>`).join('')}</div><div class="actions"><button onclick="toggleCompetencyForm(false)">Cancelar</button> <button class="primary" onclick="saveCustomCompetency()">Guardar competencia</button></div></section><div class="catalog" id="cat"></div>`;filterManual()}function filterManual(){let q=(document.querySelector('#q')?.value||'').toLowerCase(),f=document.querySelector('#ft')?.value||'Todos';cat.innerHTML=comps.filter(c=>(f==='Todos'||c.t===f)&&c.n.toLowerCase().includes(q)).map(c=>`<details><summary><div><span class="pill ${c.t==='Soft Skill'?'soft':'hard'}">${c.t}</span><h3>${c.n}</h3></div><b>＋</b></summary><div class="concept"><b>Concepto</b><p>${c.d}</p></div><div class="levels">${levels.map((x,i)=>`<div><i>${i+1}</i><b>${x}< function saveCustomCompetency(){
  const name=document.querySelector('#newCompName')?.value.trim()||'',type=document.querySelector('#newCompType')?.value||'',concept=document.querySelector('#newCompConcept')?.value.trim()||'';
  const ownLevels=[1,2,3,4,5].map(i=>document.querySelector('#newCompLevel'+i)?.value.trim()||'');
  if(!name||!type||!concept||ownLevels.some(x=>!x))return alert('Complete el nombre, tipo, concepto y la descripción propia de los cinco niveles.');
  if(comps.some(c=>c.n.trim().toLowerCase()===name.toLowerCase()))return alert('Ya existe una competencia con ese nombre.');
  const c={id:'custom_'+Date.now(),n:name,t:type,cat:'Personalizada',a:'Todas',d:concept,levels:ownLevels,custom:true};
  customCompetencies.push(c);comps.push(c);localStorage.setItem('perfil_custom_competencies',JSON.stringify(customCompetencies));
  renderManual();renderProfile();alert('Competencia añadida. Ya está disponible en el relevamiento de perfiles.');
}

function field(l,k,v,w=0,type='input'){return`<label class="field ${w?'wide':''}"><span>${l}</span>${type==='textarea'?`<textarea onchange="draft.${k}=this.value;renderProfile()">${esc(v)}</textarea>`:`<input ${type==='number'?'type="number" min="0" step=".5"':''} value="${esc(v)}" onchange="draft.${k}=${type==='number'?'+this.value':'this.value'};${type==='number'?'renderProfile()':''}">`}</label>`}function lines(t,k){return`<div><h4>${t}</h4>${draft[k].map((x,i)=>`<label class="line"><i>${i+1}</i><textarea onchange="draft.${k}[${i}]=this.value">${esc(x)}</textarea></label>`).join('')}</div>`}function changeFamily(v){let x=params.find(z=>z[0]===v);Object.assign(draft,{familia:v,general:Math.max(0,x[1]-x[2]),especifica:x[2],generalEn:'',especificaEn:'',trayectoria:x[3]});renderProfile()}function choose(id){let i=draft.competencias.findIndex(x=>x.id===id);if(i>=0)draft.competencias.splice(i,1);else if(draft.competencias.length<8)draft.competencias.push({id,nivel:3});else return alert('El manual establece máximo 8 competencias por perfil.');renderProfile()}function setComp(id,n){draft.competencias.find(x=>x.id===id).nivel=n}function addSkill(){if(draft.habilidades.length<8){draft.habilidades.push({nombre:'',nivel:3});renderProfile()}}function saveProfile(){let x=params.find(z=>z[0]===draft.familia),suma=(+draft.general||0)+(+draft.especifica||0);if(!draft.cargo)return alert('Ingrese el nombre del cargo.');if(suma<x[1])return alert(`La experiencia asignada (${years(suma)}) no alcanza el mínimo requerido de ${years(x[1])}.`);draft.id=draft.id||crypto.randomUUID();draft.fecha=draft.fecha||new Date().toISOString();profiles=profiles.filter(x=>x.id!==draft.id).concat(JSON.parse(JSON.stringify(draft)));localStorage.setItem('frigor_profiles',JSON.stringify(profiles));alert('Perfil guardado correctamente.')}
function emptyEval(id=''){return{perfilId:id,candidato:'',cargoActual:'',fecha:new Date().toISOString().slice(0,10),evidencias:['','','',''],cumplimientos:['','','',''],niveles:{},habilidades:{},fortalezas:'',brechas:'',recomendacion:''}}function scores(p,e){let ex=e.cumplimientos.reduce((s,x)=>s+(x==='Cumple totalmente'?1:x==='Cumple parcialmente'?.5:0),0)/4,co=p.competencias.length?p.competencias.reduce((s,x)=>s+Math.min((e.niveles[x.id]||0)/x.nivel,1),0)/p.competencias.length:0,ha=p.habilidades.length?p.habilidades.reduce((s,x)=>s+Math.min((e.habilidades[x.nombre]||0)/x.nivel,1),0)/p.habilidades.length:0;return{ex,co,ha,total:(ex+co+ha)/3}}

function filterProfileCompetencies(){
  const q=(document.querySelector('#profileCompSearch')?.value||'').toLowerCase().trim();

function v4SkillRow(x){return`<div><b>${esc(x.n)}</b>${dots(x.l)}<em>${x.l} · ${levels[x.l-1]}</em></div>`}
function v4SkillGroups(p){
  const selected=p.competencias.map(x=>{const c=comps.find(z=>z.id===x.id);return c?{n:c.n,t:c.t,cat:c.cat,l:x.nivel}:null}).filter(Boolean);
  const soft=selected.filter(x=>x.t==='Soft Skill'&&x.cat!=='Transversal');

const reportV3=report;

  const holder=document.createElement('div');
  holder.innerHTML=reportV3(p,e,s);
  const paper=holder.querySelector('.paper');
  const topLabel=paper?.querySelector('.paperhead span');
  if(topLabel){topLabel.textContent='JOB SKILL PROFILE';topLabel.classList.add('report-direct-label')}
  paper?.querySelectorAll('.block').forEach(block=>{
    const heading=block.querySelector('h3')?.textContent||'';
    if(heading.includes('KPI')||heading.includes('Misión')||heading.includes('Responsabilidades')) block.remove();

    `Es referente en ${c.n.toLowerCase()}; define criterios y prácticas para ${conceptoMin}. Desarrolla capacidades en otros y genera mejoras sostenibles con impacto en la organización.`

};

let showComparison=Boolean(currentEval&&currentEval.candidato);

function selectReportProfile(profileId){
  const evaluation=evals.find(x=>x.perfilId===profileId);
  currentEval=evaluation||emptyEval(profileId);
  showComparison=Boolean(evaluation&&evaluation.candidato);
  renderReport();
}

function selectReportCandidate(candidate){
  const profileId=currentEval?.perfilId||'';
  if(!candidate){
    currentEval=emptyEval(profileId);
    showComparison=false;
  }else{
    currentEval=evals.find(x=>x.perfilId===profileId&&x.candidato===candidate)||emptyEval(profileId);
    showComparison=true;
  }
  renderReport();
}

function toggleReportComparison(checked){
  showComparison=Boolean(checked&&currentEval?.candidato);
  renderReport();
}

renderReport=function(){
  currentEval=currentEval||emptyEval();
  const p=profiles.find(x=>x.id===currentEval.perfilId);
  const visibleEval=showComparison&&currentEval.candidato?currentEval:emptyEval(currentEval.perfilId);
  const s=p?scores(p,visibleEval):null;
  const candidateControl=showComparison
    ?`<select aria-label="Candidato comparado" onchange="selectReportCandidate(this.value)"><option value="">Sin candidato</option>${evals.filter(x=>x.perfilId===currentEval.perfilId).map(x=>`<option value="${esc(x.candidato)}" ${x.candidato===currentEval.candidato?'selected':''}>${esc(x.candidato)}</option>`).join('')}</select>`
    :`<span class="profile-only-view">Vista: Mi perfil de puesto</span>`;
  p5.innerHTML=title('05','Perfil e informe consolidado',showComparison?'Ficha formal con comparativa del candidato':'Ficha formal del perfil de puesto')+
    `<div class="controls"><select aria-label="Perfil de puesto" onchange="selectReportProfile(this.value)"><option value="">Seleccione perfil…</option>${profiles.map(x=>`<option value="${x.id}" ${x.id===currentEval.perfilId?'selected':''}>${esc(x.cargo)}</option>`).join('')}</select>${candidateControl}<label class="comparison-toggle"><input id="show" type="checkbox" ${showComparison?'checked':''} ${currentEval.candidato?'':'disabled'} onchange="toggleReportComparison(this.checked)"> Mostrar comparativa</label><button class="primary" onclick="print()">Descargar PDF</button></div>`+

chart=function(a,compare=showComparison){
  const valid=a.filter(x=>x.r>0&&!horizontalChartNames.has(x.n));
  const h=Math.max(235,valid.length*36+60),L=235,step=78;
  const pctX=L+step*5+72;
  const reqCoords=valid.map((x,i)=>[L+x.r*step,50+i*36]);
  const candCoords=valid.map((x,i)=>[L+(x.c||0)*step,50+i*36]);
  const smoothPath=pts=>{if(!pts.length)return'';if(pts.length===1)return`M ${pts[0][0]} ${pts[0][1]}`;let d=`M ${pts[0][0]} ${pts[0][1]}`;for(let i=0;i<pts.length-1;i++){const p0=pts[i-1]||pts[i],p1=pts[i],p2=pts[i+1],p3=pts[i+2]||p2;const c1x=p1[0]+(p2[0]-p0[0])/6,c1y=p1[1]+(p2[1]-p0[1])/6,c2x=p2[0]-(p3[0]-p1[0])/6,c2y=p2[1]-(p3[1]-p1[1])/6;d+=` C ${c1x} ${c1y}, ${c2x} ${c2y}, ${p2[0]} ${p2[1]}`}return d};
  const empty=!valid.length?'<text x="380" y="120" text-anchor="middle">No hay competencias del perfil para graficar.</text>':'';
  const title=compare?'Comparativo del perfil y la persona evaluada':'Nivel requerido del perfil de puesto';
  const evaluatedLegend=compare?'<span><i class="evaluated-line"></i>Azul · Evaluado</span>':'';
  const evaluatedPath=compare&&valid.length>1?`<path class="evaluated-path" d="${smoothPath(candCoords)}"/>`:'';
  const adequacyHeader=compare?`<line class="chart-divider" x1="${pctX-24}" y1="25" x2="${pctX-24}" y2="${h-15}"/><text class="adequacy-head" x="${pctX}" y="19" text-anchor="middle">% ADECUACIÓN</text>`:'';
  return`<div class="chart-head"><span class="chart-title">${title}</span><span class="chart-legend"><span><i class="profile-line"></i>Rojo · Perfil</span>${evaluatedLegend}</span></div><div class="chart"><svg viewBox="0 0 760 ${h}">${[1,2,3,4,5].map(n=>`<g><line x1="${L+n*step}" y1="30" x2="${L+n*step}" y2="${h-15}"/><text x="${L+n*step}" y="19" text-anchor="middle">${n}</text></g>`).join('')}${adequacyHeader}${valid.length>1?`<path class="profile-path" d="${smoothPath(reqCoords)}"/>`:''}${evaluatedPath}${valid.map((x,i)=>{const y=50+i*36,ad=x.c>=x.r?100:Math.round(((x.c||0)/x.r)*100);return`<g><text x="${L-12}" y="${y+4}" text-anchor="end">${esc(x.n.length>31?x.n.slice(0,29)+'…':x.n)}</text><circle class="profile-point" cx="${L+x.r*step}" cy="${y}" r="5"/>${compare?`<circle class="evaluated-point" cx="${L+(x.c||0)*step}" cy="${y}" r="5"/><text class="adequacy" x="${pctX}" y="${y+4}" text-anchor="middle">${ad}%</text>`:''}</g>`}).join('')}${empty}</svg></div>`;
};

  const holder=document.createElement('div');
  holder.innerHTML=reportV10Base(p,e,s);

  }
  return paper.outerHTML;
};

function profileFromRow(row,rowNumber){
  const cargo=String(row.Cargo||'').trim(),familia=String(row.Familia||'').trim().toUpperCase(),area=String(row.Area_Gerencia||'').trim();
  if(!cargo)return{error:`Fila ${rowNumber}: falta Cargo.`};
  const param=params.find(x=>normalizeText(x[0])===normalizeText(familia));
  if(!param)return{error:`Fila ${rowNumber}: la familia “${familia}” no existe en Parámetros.`};
  const selected=[];
  for(let i=1;i<=8;i++){
    const name=String(row[`Competencia_${i}`]||'').trim(),level=Number(row[`Nivel_${i}`]||0);
    if(!name&&!level)continue;
    const comp=comps.find(c=>normalizeText(c.n)===normalizeText(name));
    if(!comp)return{error:`Fila ${rowNumber}: la competencia “${name}” no existe en el Manual.`};
    if(!Number.isInteger(level)||level<1||level>5)return{error:`Fila ${rowNumber}: Nivel_${i} debe ser un número entre 1 y 5.`};
    if(selected.some(x=>x.id===comp.id))return{error:`Fila ${rowNumber}: la competencia “${name}” está repetida.`};
    selected.push({id:comp.id,nivel:level});
  }
  const existing=profiles.find(p=>normalizeText(p.cargo)===normalizeText(cargo)&&normalizeText(p.area)===normalizeText(area));
  return{profile:{...(existing||fresh()),id:existing?.id||crypto.randomUUID(),cargo,familia:param[0],area,reporta:String(row.Reporta_a||'').trim(),supervisa:String(row.Supervisa_a||'').trim(),formacion:String(row.Formacion_en||'').trim(),posgrado:String(row.Diplomado_Posgrado_en||'').trim(),maestria:String(row.Maestria_en||'').trim(),general:param[1],especifica:param[2],trayectoria:param[3],generalEn:String(row.Experiencia_general_en||'').trim(),especificaEn:String(row.Experiencia_especifica_en||'').trim(),competencias:selected,habilidades:[],fecha:new Date().toISOString()},updated:Boolean(existing)};
}

    let created=0,updated=0;results.forEach(r=>{profiles=profiles.filter(p=>p.id!==r.profile.id).concat(r.profile);r.updated?updated++:created++});

function collectV15Competencies(row,rowNumber){
  const selected=[];
  const add=(name,level,expectedType,label)=>{
    name=String(name||'').trim();level=Number(level||0);if(!name&&!level)return null;
    const comp=comps.find(c=>normalizeText(c.n)===normalizeText(name));
    if(!comp)return `Fila ${rowNumber}: la competencia “${name}” no existe en el Manual.`;
    if(comp.t!==expectedType)return `Fila ${rowNumber}: “${name}” no corresponde al bloque ${expectedType}.`;
    if(!Number.isInteger(level)||level<1||level>5)return `Fila ${rowNumber}: ${label} debe ser un número entre 1 y 5.`;
    if(selected.some(x=>x.id===comp.id))return `Fila ${rowNumber}: la competencia “${name}” está repetida.`;
    selected.push({id:comp.id,nivel:level});return null;
  };
  for(let i=1;i<=8;i++){let err=add(row[`Soft_Skill_${i}`],row[`Nivel_Soft_${i}`],'Soft Skill',`Nivel_Soft_${i}`);if(err)return{error:err};err=add(row[`Hard_Skill_${i}`],row[`Nivel_Hard_${i}`],'Hard Skill',`Nivel_Hard_${i}`);if(err)return{error:err}}
  if(selected.length>8)return{error:`Fila ${rowNumber}: existen ${selected.length} competencias; el máximo permitido es 8 en total.`};
  return{selected};
}

function profileProgress(p){
  const paramFields=['cargo','familia','area','departamento','reporta','formacion','generalEn','especificaEn'];
  const paramDone=paramFields.filter(k=>String(p[k]??'').trim()).length;
  const parameterPct=paramDone/paramFields.length;
  const chosen=(p.competencias||[]).filter(x=>Number(x.nivel)>=1&&Number(x.nivel)<=5);
  const hasSoft=chosen.some(x=>comps.find(c=>c.id===x.id)?.t==='Soft Skill');
  const hasHard=chosen.some(x=>comps.find(c=>c.id===x.id)?.t==='Hard Skill');
  const skillPct=(hasSoft?0.5:0)+(hasHard?0.5:0);
  const pctValue=Math.round(parameterPct*50+skillPct*50);
  const parametersComplete=parameterPct===1,skillsComplete=hasSoft&&hasHard;
  let status='En inicio';
  if(parametersComplete&&skillsComplete)status='Perfil completo';
  else if(parametersComplete)status='Solo parámetros jerárquicos';
  else if(skillsComplete)status='Solo competencias Soft y Hard';
  else if(paramDone||chosen.length)status='En construcción';
  return{pct:pctValue,status,parametersComplete,skillsComplete};
}

progressPanel=function(){
  const states=profiles.map(profileProgress),complete=states.filter(x=>x.parametersComplete&&x.skillsComplete).length,onlyParameters=states.filter(x=>x.parametersComplete&&!x.skillsComplete).length,onlySkills=states.filter(x=>x.skillsComplete&&!x.parametersComplete).length;
  const equivalent=states.reduce((s,x)=>s+x.pct/100,0),advance=Math.min(100,equivalent/profileTarget*100),pending=Math.max(0,profileTarget-complete);
  return `<section class="card progress-card"><h3>Avance del relevamiento de perfiles</h3><div class="progress-grid-v16"><div class="target-box"><label>Total de cargos de la estructura</label><input type="number" min="1" step="1" value="${profileTarget}" onchange="setProfileTarget(this.value)"><small>Editable cuando cambie la estructura.</small></div><div class="metric-box complete"><span>Perfiles completos</span><b>${complete}</b><small>Parámetros + Soft + Hard</small></div><div class="metric-box parameters"><span>Solo parámetros jerárquicos</span><b>${onlyParameters}</b><small>Competencias pendientes</small></div><div class="metric-box skills"><span>Solo competencias Soft y Hard</span><b>${onlySkills}</b><small>Parámetros pendientes</small></div><div class="metric-box highlight"><span>Avance global ponderado</span><b>${advance.toFixed(1).replace('.',',')}%</b><small>${pending} perfiles completos pendientes</small></div></div><div class="progress-track"><i style="width:${advance}%"></i></div><div class="progress-caption"><span>${equivalent.toFixed(1).replace('.',',')} perfiles equivalentes completados</span><span>Meta actual: ${profileTarget} cargos</span></div></section>`;
};

function profileRows(list){
  return list.length?list.map(p=>{const a=profileProgress(p),bar=a.pct===100?'advance-100':a.pct>=50?'advance-mid':'advance-low';return `<tr data-profile-row data-cargo="${esc(normalizeText(p.cargo))}" data-area="${esc(normalizeText(p.area))}"><td><b>${esc(p.cargo)}</b></td><td><span class="pill">${esc(p.familia)}</span></td><td>${esc(p.area||'No especificada')}</td><td><span class="department-chip">${esc(p.departamento||'No especificado')}</span></td><td><div class="advance-cell"><b>${a.pct}%</b><div class="advance-line"><i class="${bar}" style="width:${a.pct}%"></i></div><span class="advance-label">${a.status}</span></div></td><td>${p.fecha?new Date(p.fecha).toLocaleDateString('es-BO'):'—'}</td><td><div class="profile-actions"><button class="edit-btn" onclick="editStoredProfile('${p.id}')">Editar</button><button class="delete-btn" onclick="deleteStoredProfile('${p.id}')">Eliminar</button></div></td></tr>`}).join(''):`<tr class="empty-profile-row"><td colspan="7" class="empty-cell">Aún no existen perfiles guardados.</td></tr>`;
}

renderProfileBase=function(){
  const list=[...profiles].sort((a,b)=>String(a.cargo).localeCompare(String(b.cargo),'es'));
  const areas=[...new Set(profiles.map(p=>String(p.area||'').trim()).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'es'));
  basePage.innerHTML=title('04','Base de perfiles de cargo','Consulte el avance, edite o elimine perfiles y gestione la carga masiva')+progressPanel()+massPanel()+
  `<section class="card"><div class="profile-filters"><label class="field"><span>Buscar por nombre de cargo</span><input id="profileCargoSearch" type="search" placeholder="Ej.: Analista de Talento Humano" oninput="filterProfileRows()"></label><label class="field"><span>Filtrar por Área</span><select id="profileAreaFilter" onchange="filterProfileRows()"><option value="">Todas las áreas</option>${areas.map(a=>`<option value="${esc(normalizeText(a))}">${esc(a)}</option>`).join('')}</select></label><button class="secondary-btn" onclick="clearProfileFilters()">Limpiar filtros</button><button class="new-btn" onclick="newProfileFromBase()">＋ Crear nuevo perfil</button></div><div class="base-count" id="profileVisibleCount">${list.length} de ${profiles.length} perfiles</div><div class="table"><table class="profile-base"><thead><tr><th>Cargo</th><th>Familia</th><th>Área</th><th>Departamento</th><th>Nivel de avance</th><th>Actualización</th><th>Acciones</th></tr></thead><tbody id="profileBaseBody">${profileRows(list)}</tbody></table></div></section>`;
};

function filterProfileRows(){
  const cargo=normalizeText(document.querySelector('#profileCargoSearch')?.value),area=normalizeText(document.querySelector('#profileAreaFilter')?.value);let visible=0;
  document.querySelectorAll('#profileBaseBody [data-profile-row]').forEach(row=>{const show=(!cargo||row.dataset.cargo.includes(cargo))&&(!area||row.dataset.area===area);row.hidden=!show;if(show)visible++});
  const count=document.querySelector('#profileVisibleCount');if(count)count.textContent=`${visible} de ${profiles.length} perfiles`;
}
function clearProfileFilters(){const q=document.querySelector('#profileCargoSearch'),a=document.querySelector('#profileAreaFilter');if(q)q.value='';if(a)a.value='';filterProfileRows();q?.focus()}
function deleteStoredProfile(id){
  const p=profiles.find(x=>x.id===id);if(!p)return;
  if(!confirm(`¿Eliminar el perfil “${p.cargo}”? Esta acción quitará también sus evaluaciones guardadas.`))return;
  profiles=profiles.filter(x=>x.id!==id);evals=evals.filter(x=>x.perfilId!==id);localStorage.setItem('frigor_profiles',JSON.stringify(profiles));localStorage.setItem('frigor_evals',JSON.stringify(evals));
  if(draft?.id===id)draft=fresh();if(currentEval?.perfilId===id)currentEval=emptyEval();renderProfileBase();renderProfile();renderEval();renderReport();
}

function fitReportToSinglePageV16(){
  const paper=document.querySelector('#p5 .paper');if(!paper)return;paper.style.removeProperty('--report-print-zoom');
  const available=1060,content=Math.max(paper.scrollHeight,1),scale=Math.min(.82,available/content);paper.style.setProperty('--report-print-zoom',String(Math.max(.42,scale)));
}

function orgSeed(){var b=Uint8Array.from(atob(ORG_B64),function(c){return c.charCodeAt(0)});return new TextDecoder().decode(b).split('\n').filter(Boolean).map(function(x,i){x=x.split('|');return{id:'o'+i,area:x[0],dep:x[1],cargo:x[2],tipo:x[3],familia:x[4],jefe:x[5]}})}
let org=JSON.parse(localStorage.getItem('frigor_org')||'null')||orgSeed(),orgEdit='';
function orgSave(){localStorage.setItem('frigor_org',JSON.stringify(org))}
var st=document.createElement('style');st.textContent='.orgbox{margin-top:18px}.orgform{display:grid;grid-template-columns:2fr 1fr 1fr 1fr 2fr auto;gap:7px;margin:10px 0}.orgform input,.orgform select{width:100%}.orgtable table{min-width:1050px}.orgtable td{padding:7px}.mini-btn{border:1px solid #aebbc5;background:#fff;border-radius:6px;padding:7px;color:var(--n);font-weight:bold}.auto-note{font-size:9px;color:#3979b6;text-transform:none}@media(max-width:900px){.orgform{grid-template-columns:1fr}}';document.head.appendChild(st);
function on(v){return normalizeText(String(v||''))}
function orgOpts(){return '<option value="">Seleccione cargo…</option>'+org.slice().sort(function(a,b){return a.cargo.localeCompare(b.cargo,'es')}).map(function(r){return '<option value="'+r.id+'" '+(draft.orgId===r.id?'selected':'')+'>'+esc(r.cargo)+' — '+esc(r.area)+' / '+esc(r.dep)+'</option>'}).join('')}
function pickOrg(id){var r=org.find(function(x){return x.id===id});if(!r)return;var f=params.find(function(x){return on(x[0])===on(r.familia)});Object.assign(draft,{orgId:id,cargo:r.cargo,area:r.area,departamento:r.dep,reporta:r.jefe});if(f)Object.assign(draft,{familia:f[0],general:f[1],especifica:f[2],trayectoria:f[3]});renderProfile()}
function profileOrg(){var fs=[].slice.call(document.querySelectorAll('#p3 .field')),c=fs.find(function(x){return x.querySelector('span')&&x.querySelector('span').textContent.trim()==='Nombre del cargo'}),j=fs.find(function(x){return x.querySelector('span')&&x.querySelector('span').textContent.trim()==='Reporta a'});if(c)c.innerHTML='<span>Nombre del cargo</span><select onchange="pickOrg(this.value)">'+orgOpts()+'</select><small class="auto-note">Completa Área, Departamento, Familia y cargo del inmediato superior.</small>';if(j)j.querySelector('span').textContent='Cargo del inmediato superior'}
var rp17=renderProfile;renderProfile=function(){rp17();profileOrg()};
function orgPanel(){var rows=org.slice().sort(function(a,b){return a.cargo.localeCompare(b.cargo,'es')}),r=org.find(function(x){return x.id===orgEdit})||{},fo=params.map(function(x){return '<option '+(on(x[0])===on(r.familia)?'selected':'')+'>'+esc(x[0])+'</option>'}).join('');return '<section class="card orgbox"><h3>Base de familias, áreas y cargos</h3><div class="note">Base cargada desde el Excel adjunto. Edítala aquí; los cambios actualizan el relevamiento automáticamente.</div><div class="orgform"><input id="oc" placeholder="Cargo" value="'+esc(r.cargo||'')+'"><input id="oa" placeholder="Área" value="'+esc(r.area||'')+'"><input id="od" placeholder="Departamento" value="'+esc(r.dep||'')+'"><select id="of">'+fo+'</select><input id="oj" placeholder="Cargo del inmediato superior" value="'+esc(r.jefe||'')+'"><button class="primary" onclick="orgPut()">Guardar</button></div><div class="toolbar"><input id="oq" type="search" placeholder="Buscar cargo o área…" oninput="orgFilter(this.value)"><button class="mini-btn" onclick="orgReset()">Restaurar base adjunta</button></div><div class="table orgtable"><table><thead><tr><th>Cargo</th><th>Familia</th><th>Área</th><th>Departamento</th><th>Inmediato superior</th><th>Acción</th></tr></thead><tbody>'+rows.map(function(x){return '<tr data-org="'+esc(on(x.cargo+' '+x.area))+'"><td><b>'+esc(x.cargo)+'</b></td><td>'+esc(x.familia)+'</td><td>'+esc(x.area)+'</td><td>'+esc(x.dep)+'</td><td>'+esc(x.jefe||'—')+'</td><td><button class="mini-btn" onclick="orgEdit=\''+x.id+'\';renderParams()">Editar</button> <button class="delete-btn" onclick="orgDel(\''+x.id+'\')">Eliminar</button></td></tr>'}).join('')+'</tbody></table></div></section>'}
function orgPut(){var x={id:orgEdit||crypto.randomUUID(),cargo:document.querySelector('#oc').value.trim(),area:document.querySelector('#oa').value.trim(),dep:document.querySelector('#od').value.trim(),familia:document.querySelector('#of').value,jefe:document.querySelector('#oj').value.trim(),tipo:'ADMINISTRATIVO'};if(!x.cargo||!x.area)return alert('Complete Cargo y Área.');org=org.filter(function(y){return y.id!==x.id}).concat(x);orgEdit='';orgSave();renderParams();renderProfile()}
function orgDel(id){if(confirm('¿Eliminar este cargo de la base?')){org=org.filter(function(x){return x.id!==id});orgSave();renderParams();renderProfile()}}

rt-title,.chart-legend{font-size:9px!important}.chart{padding:6px!important;overflow:hidden!important}.chart svg{display:block!important;width:100%!important;min-width:0!important;height:82mm!important;max-height:82mm!important}.chart text{font-size:11px!important}.evalreport{break-before:auto!important;page-break-before:auto!important;margin-top:8px!important;padding-top:8px!important}.mini,.summary{gap:7px!important;margin:7px 0!important}.sign{margin-top:16mm!important;gap:25px!important}.sign span{padding-top:5px!important;font-size:10px!important}</style></head><body><main class="print-page"><div class="print-stage">'+source.outerHTML+'</div></main></body></html>');

function addCompetencyAndChooseLevel(id){
  if(!id)return;
  if(draft.competencias.some(x=>x.id===id))return;
  if(draft.competencias.length>=8)return alert('El manual establece máximo 8 competencias por perfil.');
  draft.competencias.push({id,nivel:0});
  renderProfile();
  requestAnimationFrame(()=>document.querySelector(`.selected-competency[data-id="${id}"] select`)?.focus());
}
function removeSelectedCompetency(id){
  draft.competencias=draft.competencias.filter(x=>x.id!==id);
  renderProfile();
}
function renderCompetencyWorkflow(){
  const card=[...document.querySelectorAll('#p3 .card')].find(x=>x.querySelector('h3')?.textContent.includes('Competencias del perfil'));
  if(!card)return;
  const heading=card.querySelector('h3');
  heading.innerHTML=`Competencias del perfil <em>${draft.competencias.length}/8</em>`;
  [...card.children].filter(x=>x!==heading).forEach(x=>x.remove());
  const selected=draft.competencias.map(item=>({item,comp:comps.find(c=>c.id===item.id)})).filter(x=>x.comp);
  const available=comps.filter(c=>!draft.competencias.some(x=>x.id===c.id));
  const selectedHtml=selected.length?selected.map(({item,comp})=>{
    const detail=item.nivel?`<p class="level-detail"><strong>${levels[item.nivel-1]}:</strong> ${esc(desc(comp,item.nivel))}</p>`:`<p class="level-detail pending"><strong>Nivel pendiente:</strong> seleccione ahora el nivel requerido.</p>`;
    return `<div class="selected-competency" data-id="${comp.id}"><div class="comp-name"><b>${esc(comp.n)}</b><small class="pill ${comp.t==='Soft Skill'?'soft':'hard'}">${comp.t}</small></div><div class="level-control"><select onchange="setComp('${comp.id}',+this.value)"><option value="0" disabled ${!item.nivel?'selected':''}>Seleccione nivel…</option>${levels.map((name,i)=>`<option value="${i+1}" ${item.nivel===i+1?'selected':''}>${i+1} · ${name}</option>`).join('')}</select>${detail}</div><button class="remove-comp" type="button" title="Quitar competencia" onclick="removeSelectedCompetency('${comp.id}')">×</button></div>`;
  }).join(''):'<div class="competency-empty">Aún no seleccionó competencias para este perfil.</div>';
  card.insertAdjacentHTML('beforeend',`<div class="competency-workflow"><div class="competency-add"><label><span>Añadir competencia</span><select onchange="addCompetencyAndChooseLevel(this.value)"><option value="">Seleccione una competencia…</option>${available.map(c=>`<option value="${c.id}">${esc(c.n)} · ${c.t}</option>`).join('')}</select></label><small>${8-draft.competencias.length} disponibles por añadir</small></div><div class="selected-competencies">${selectedHtml}</div></div>`);

function compactAreaDepartments(source){
  const seen=new Set();
  return (source||[]).reduce(function(list,row){
    const area=String(row.area||'').trim(),dep=String(row.dep||'').trim();
    if(!area||!dep)return list;
    const key=on(area)+'|'+on(dep);
    if(seen.has(key))return list;
    seen.add(key);
    list.push({id:'ad_'+key.replace(/[^a-z0-9]+/g,'_'),area:area,dep:dep});
    return list;
  },[]).sort(function(a,b){return a.area.localeCompare(b.area,'es')||a.dep.localeCompare(b.dep,'es')});
}

/* V29 · Criterio de experiencia para la familia operativa */
const operativeFamily=params.find(function(row){return row[0]==='OPERARIO'});

function readExperienceParams(){
  try{
    const saved=JSON.parse(localStorage.getItem(experienceStorageKey)||'{}');
    params.forEach(function(row){
      const value=saved[row[0]];
      if(value&&Number.isFinite(+value.general)&&Number.isFinite(+value.especifica)){
        row[1]=Math.max(0,+value.general);
        row[2]=Math.max(0,+value.especifica);
      }
    });
  }catch(_e){}
}

function writeExperienceParams(){
  const saved={};
  params.forEach(function(row){saved[row[0]]={general:+row[1]||0,especifica:+row[2]||0}});
  localStorage.setItem(experienceStorageKey,JSON.stringify(saved));
}

function syncExperienceByFamily(family,refreshDate){
  const row=params.find(function(x){return x[0]===family});
  if(!row)return;
  let changed=false;
  profiles.forEach(function(profile){
    if(profile.familia===family){
      profile.general=row[1];
      profile.especifica=row[2];
      profile.trayectoria=row[3];
      if(refreshDate)profile.fecha=new Date().toISOString();
      changed=true;
    }
  });
  if(changed)localStorage.setItem('frigor_profiles',JSON.stringify(profiles));
  if(draft&&draft.familia===family){
    draft.general=row[1];
    draft.especifica=row[2];
    draft.trayectoria=row[3];
  }
}

function setExperienceParam(rowIndex,kind,value,input){
  const row=params[rowIndex],numeric=Number(value);
  if(!row||!Number.isFinite(numeric)||numeric<0){
    alert('Ingrese una cantidad de años válida, igual o mayor a 0.');
    if(input)input.value=row?row[kind==='general'?1:2]:0;
    return;
  }
  row[kind==='general'?1:2]=Math.round(numeric*2)/2;
  writeExperienceParams();
  syncExperienceByFamily(row[0],true);
  if(input){input.value=row[kind==='general'?1:2];input.classList.remove('saved');void input.offsetWidth;input.classList.add('saved')}
  renderProfile();
  renderProfileBase();
  renderEval();
  renderReport();
}

function jobSkillAcademicRows(p,e){

<script>
/* V51 · Resultado compuesto únicamente por A Formación y B Competencias/Habilidades */
function combinedSkillItemsV51(p){
  const soft=profileSoftCompetencies(p).map(item=>({...item,source:'soft'}));
  const hard=profileTechnicalSkills(p).map(item=>({...item,source:'hard'}));
  return soft.concat(hard).sort((a,b)=>a.n.localeCompare(b.n,'es',{sensitivity:'base'}));
}
function combinedSkillValueV51(e,item){
  return item.source==='hard'?technicalValue(e.habilidades,item.n):Number(e.niveles?.[item.id]||0);
}
function setCombinedSkillLevelV51(source,id,name,value){
  if(source==='hard')setTechnicalLevel(name,value);
  else{currentEval.niveles=currentEval.niveles||{};currentEval.niveles[id]=Number(value)||0;renderEval()}
}
scores=function(p,e){
  const criteria=jobSkillAcademicRows(p,e);
  const academic=criteria.length?criteria.reduce((sum,row)=>sum+(row[3]==='Cumple totalmente'?1:row[3]==='Cumple parcialmente'?.5:0),0)/criteria.length:0;
  const skills=combinedSkillItemsV51(p);
  const competency=skills.length?skills.reduce((sum,item)=>sum+Math.min(combinedSkillValueV51(e,item)/(Number(item.nivel)||1),1),0)/skills.length:0;
  return{ex:academic,co:competency,ha:competency,total:(academic+competency)/2};
};
function combinedSkillSectionV51(p,e,s){
  const items=combinedSkillItemsV51(p);
  if(!items.length)return '<section class="card"><h3>B · Competencias/Habilidades <em>Sin requisitos cargados</em></h3></section>';
  return `<section class="card"><h3>B · Competencias/Habilidades <em>${pct(s.co)}</em></h3><div class="levelrow head"><b>Competencia / habilidad</b><b>Requerido</b><b>Nivel del candidato</b><b>Resultado</b><b>Adecuación</b></div>${items.map(item=>{const value=combinedSkillValueV51(e,item),adequacy=item.nivel?Math.min(100,Math.round(value/item.nivel*100)):0,safeName=esc(item.n).replaceAll("'","\\'");return `<div class="levelrow"><div><b>${esc(item.n)}</b><small>${item.source==='hard'?'Hard Skill':'Soft Skill'}</small></div><b>${item.nivel} · ${levels[item.nivel-1]||'—'}</b><select onchange="setCombinedSkillLevelV51('${item.source}','${esc(item.id)}','${safeName}',this.value)"><option value="0">Pendiente</option>${levels.map((label,i)=>`<option value="${i+1}" ${value===i+1?'selected':''}>${i+1} · ${label}</option>`).join('')}</select><span class="result ${value>=item.nivel?'ok':value?'partial':'bad'}">${value>=item.nivel?'Cumple totalmente':value?'Cumple parcialmente':'No evaluado'}</span><b>${adequacy}%</b></div>`}).join('')}</section>`;
}
evalBody=function(p,e){

<script>
/* V52 · Recupera evaluaciones Hard guardadas anteriormente como competencias. */
function legacyHardValueV52(e,item){
  const levelsMap=e?.niveles||{};
  const aliases=new Set([String(item.id||''),technicalKey(item.n)]);
  comps.filter(c=>c.t==='Hard Skill'&&technicalKey(c.n)===technicalKey(item.n)).forEach(c=>aliases.add(String(c.id||'')));
  let value=0;
  Object.entries(levelsMap).forEach(([key,raw])=>{
    if(aliases.has(String(key))||technicalKey(key)===technicalKey(item.n))value=Math.max(value,Number(raw)||0);
  });
  return value;
}
function migrateLegacyHardValuesV52(record){
  if(!record)return record;
  record.habilidades=normalizeTechnicalMap(record.habilidades);
  comps.filter(c=>c.t==='Hard Skill').forEach(c=>{
    const legacy=Number(record.niveles?.[c.id]||0);
    const key=technicalKey(c.n);
    if(legacy&&!record.habilidades[key])record.habilidades[key]=legacy;
  });
  return record;
}
const combinedSkillValueV51Base=combinedSkillValueV51;
combinedSkillValueV51=function(e,item){
  const current=combinedSkillValueV51Base(e,item);
  return item.source==='hard'?Math.max(current,legacyHardValueV52(e,item)):current;
};
candidates.forEach(migrateLegacyHardValuesV52);
evals.forEach(migrateLegacyHardValuesV52);
migrateLegacyHardValuesV52(currentEval);
localStorage.setItem(candidateKey,JSON.stringify(candidates));
localStorage.setItem('frigor_evals',JSON.stringify(evals));
const saveEvalV52Base=saveEval;
saveEval=function(){migrateLegacyHardValuesV52(currentEval);return saveEvalV52Base()};
renderEval();renderReport();renderCandidateComparison();
</script>
<script>
/* V53 · Edición efectiva de niveles y gráfico sincronizado con Competencias/Habilidades. */
function hasTechnicalValueV53(map,name){
  return Object.prototype.hasOwnProperty.call(normalizeTechnicalMap(map),technicalKey(name));
}
function clearLegacyHardValueV53(record,id,name){
  if(!record)return;
  record.niveles=record.niveles||{};
  const target=technicalKey(name);
  const aliases=new Set([String(id||''),target]);
  comps.filter(c=>c.t==='Hard Skill'&&technicalKey(c.n)===target).forEach(c=>aliases.add(String(c.id||'')));
  Object.keys(record.niveles).forEach(key=>{
    if(aliases.has(String(key))||technicalKey(key)===target)delete record.niveles[key];
  });
}
combinedSkillValueV51=function(e,item){
  if(item.source!=='hard')return Number(e?.niveles?.[item.id]||0);
  if(hasTechnicalValueV53(e?.habilidades,item.n))return technicalValue(e.habilidades,item.n);
  return legacyHardValueV52(e,item);
};
setCombinedSkillLevelV51=function(source,id,name,value){
  const level=Number(value)||0;
  if(source==='hard'){
    currentEval.habilidades=currentEval.habilidades||{};
    currentEval.habilidades[technicalKey(name)]=level;
    clearLegacyHardValueV53(currentEval,id,name);
  }else{
    currentEval.niveles=currentEval.niveles||{};
    currentEval.niveles[id]=level;
  }
  renderEval();
  renderReport();
};
setTechnicalLevel=function(name,value){
  const item=profileTechnicalSkills(profiles.find(p=>p.id===currentEval.perfilId)||{}).find(x=>technicalKey(x.n)===technicalKey(name));
  setCombinedSkillLevelV51('hard',item?.id||technicalKey(name),name,value);
};
function comparisonChartDataV53(p,e){
  return combinedSkillItemsV51(p).map(item=>({
    n:item.n,
    r:Number(item.nivel)||0,
    c:combinedSkillValueV51(e,item)
  }));
}
const reportV53Base=report;
report=function(p,e,s){
  const holder=document.createElement('div');
  holder.innerHTML=reportV53Base(p,e,scores(p,e));
  if(e&&e.candidato){
    const current=holder.querySelector('.single-jsp-chart');
    if(current)current.innerHTML=chart(comparisonChartDataV53(p,e),true);
  }
  return holder.innerHTML;
};
const saveEvalV53Base=saveEval;
saveEval=function(){
  const profile=profiles.find(p=>p.id===currentEval.perfilId);
  if(profile)profileTechnicalSkills(profile).forEach(item=>{
    if(hasTechnicalValueV53(currentEval.habilidades,item.n))clearLegacyHardValueV53(currentEval,item.id,item.n);
  });
  return saveEvalV53Base();
};
renderEval();renderReport();renderCandidateComparison();
</script>
